services:
  finsol:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Database + uploaded files live in this volume – back it up!
      DATABASE_URL: file:/app/data/finsol.db
      MEDIA_DIR: /app/data/media
      PRIVATE_UPLOADS_DIR: /app/data/private-uploads
    volumes:
      - finsol-data:/app/data

volumes:
  finsol-data:
