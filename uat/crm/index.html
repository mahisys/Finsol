<style>
/* Layout: app shell — sidebar navigation by role, top bar with "viewing as" switcher and notifications, main work area */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eef1f8; --ink: #0e1530; --muted: #5b6480; --line: #dde2ee;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --brand: #93a9ff; --brand-soft: #1b2750; --on-brand: #0a1230; --accent: #ffad3b; --accent-strong: #ffc06a; --on-accent: #231300;
  --side: #0a1230; --on-side: #dfe5ff; --on-side-muted: #8d99c9;
  --good: #4ade80; --good-soft: #10301f; --warn: #fbbf24; --warn-soft: #33260b; --bad: #f87171; --bad-soft: #3a1616; --info: #93b4ff; --info-soft: #16244a;
  --shadow: 0 16px 40px -24px rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #080d1f; --surface: #10182f; --surface-2: #17213f; --ink: #e8ecf8; --muted: #a1abc8; --line: #26325a;
  --brand: #93a9ff; --brand-soft: #1b2750; --on-brand: #0a1230; --accent: #ffad3b; --accent-strong: #ffc06a; --on-accent: #231300;
  --side: #0a1230; --on-side: #dfe5ff; --on-side-muted: #8d99c9;
  --good: #4ade80; --good-soft: #10301f; --warn: #fbbf24; --warn-soft: #33260b; --bad: #f87171; --bad-soft: #3a1616; --info: #93b4ff; --info-soft: #16244a;

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }

/* shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }

}

.btn:hover { transform: translateY(-1px); }

.btn--ghost:hover { border-color: var(--brand); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.card--flush { padding: 0; overflow: hidden; }
.card__head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

a.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

.kpi span { color: var(--muted); font-size: .84rem; }
.kpi--warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }

.kpi--bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip--info { background: var(--info-soft); color: var(--info); }

.field input, .field select, .field textarea { font-weight: 500; font-size: .94rem; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }

@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
.err { color: var(--bad); font-size: .84rem; font-weight: 600; }

.note--warn { background: var(--warn-soft); }
.note--info { background: var(--info-soft); }
.bar-list { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 170px minmax(0,1fr) 34px; gap: 10px; align-items: center; font-size: .88rem; text-decoration: none; color: inherit; }
.bar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 6px; transition: width .5s; }

/* case page */
.case-head { display: grid; gap: 14px; }
.case-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.meta-row { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.meta-row b { color: var(--ink); font-weight: 600; }
.stepper { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.stepper div { display: grid; gap: 6px; font-size: .74rem; color: var(--muted); font-weight: 600; text-align: center; }

.people { display: grid; gap: 10px; }
.person { display: flex; gap: 10px; align-items: center; font-size: .88rem; }

.timeline li::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); margin-top: 6px; }

.req { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }

.email { border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: .88rem; display: grid; gap: 6px; background: var(--surface-2); }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(5,10,30,.55); display: grid; place-items: center; padding: 16px; animation: pop .2s ease; }

.drawer__list { overflow: auto; padding: 8px; display: grid; gap: 4px; align-content: start; }

.notif:hover { background: var(--surface-2); }
.notif.unread { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); animation: pop .25s ease; }
.alloc td select { padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }

/* =================== OCR (simulated) =================== */
function applyOcr(c, type) {
  const found = OCR_SAMPLE[type]; if (!found) return 0;
  let n = 0;
  Object.entries(found).forEach(([k, [val, conf]]) => {
    const meta = (c.ocr[k] = c.ocr[k] || { values: [] });
    if (!meta.values.some((v) => v.value === val)) meta.values.push({ value: val, conf, src: type });
    if (!c.applicant[k]) { c.applicant[k] = val; meta.source = type; meta.conf = conf; }
    n++;
  });
  return n;
}
const norm = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').replace(/\b([A-Z])\b/g, '$1').replace(/\s+/g, ' ').trim();
function conflicts(c, k) { const vals = c.ocr[k]?.values || []; const uniq = [...new Map(vals.map((v) => [norm(v.value), v])).values()]; return uniq.length > 1 ? uniq : null; }

function modal({ title, body, submit = 'Save', danger = false, onSubmit, wide = false }) {
  const root = $('#overlayRoot');
  root.innerHTML = `<div class="overlay" id="ov"><form class="modal" id="mform" novalidate style="${wide ? 'width:min(760px,100%)' : ''}"><div class="modal__head"><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal__body">${body}<p class="err" id="merr" hidden></p></div><div class="modal__foot"><button type="button" class="btn btn--ghost" data-close>Cancel</button>${submit ? `<button type="submit" class="btn ${danger ? 'btn--danger' : 'btn--primary'}">${submit}</button>` : ''}</div></form></div>`;
  const close = () => { root.innerHTML = ''; };
  $$('[data-close]', root).forEach((b) => b.addEventListener('click', close));
  $('#ov').addEventListener('click', (e) => { if (e.target.id === 'ov') close(); });
  $('#mform').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    f._all = (name) => new FormData(e.target).getAll(name);
    const err = onSubmit(f);
    if (err) { $('#merr').textContent = err; $('#merr').hidden = false; return; }
    close(); save(); render();
  });
  $('input, select, textarea', root)?.focus();
}

      c.disbursal = { amount: +f.amount, date: Date.parse(f.date) || now(), lan: f.lan, mode: f.mode }; c.status = 'disbursed';
      log(c, `Disbursed ${amt(f.amount)}, loan account ${f.lan}`);
      c.commission = makeCommission(c);
      log(c, `Commission worked out: ${c.commission.rate}% of ${inr(c.commission.base)} = ${inr(c.commission.amount)}${c.commission.partnerId ? `; referral payout ${inr(c.commission.partnerAmount)}` : ''}`, 'system');
      notify([c.createdBy, c.assignee, ...managerIds(), ...adminIds()], `Disbursed: ${c.applicant.name}, ${amt(f.amount)}`, c, true);
      notify(adminIds(), `Commission ${inr(c.commission.amount)} ready to invoice to ${bank(c.bankId).name} (${c.applicant.name})`, c);
    } });
  },
  withdraw(ds) { const c = getCase(ds.case); modal({ title: 'Withdraw case', body: '<label class="field">Reason<textarea name="reason" placeholder="For example: customer took a loan elsewhere"></textarea></label>', submit: 'Withdraw', danger: true, onSubmit(f) { if (!f.reason) return 'Give a reason.'; c.status = 'withdrawn'; c.withdrawReason = f.reason; log(c, `Withdrawn: ${f.reason}`); notify([c.createdBy, c.assignee, ...managerIds()], `Withdrawn: ${c.applicant.name}`, c); } }); },
  reopen(ds) { const c = getCase(ds.case); c.status = c.assignee ? 'processing' : 'submitted'; if (c.eligibility?.value === 'not-eligible') c.eligibility = null; log(c, 'Case reopened'); notify([c.createdBy, c.assignee], `Reopened: ${c.applicant.name}`, c); save(); render(); },
  deleteCase(ds) { const c = getCase(ds.case); modal({ title: 'Delete case?', body: `<p>${c.id} and all its documents will be deleted. Only the Super Admin can do this. The deletion is kept in the audit log.</p>`, submit: 'Delete case', danger: true, onSubmit() { S.cases = S.cases.filter((x) => x !== c); log(null, `Deleted case ${c.id} (${c.applicant.name})`); location.hash = '#cases'; } }); },
  copyBank(ds) {
    const c = getCase(ds.case);
    const used = [c.bankId, ...c.linked.map((id) => getCase(id)?.bankId)];
    modal({ title: 'Copy to another bank', body: `<p class="muted small">Creates a linked case for ${esc(c.applicant.name)} with the same documents, routed to that bank's Backend Executives.</p><label class="field">Bank<select name="bankId">${banks().filter((b) => !used.includes(b.id)).map((b) => `<option value="${b.id}">${b.name}</option>`).join('')}</select></label><label class="field">Loan amount (₹)<input name="amount" value="${c.amount}"></label>`, submit: 'Create and submit', onSubmit(f) {
      if (!f.bankId) return 'All banks already have a case for this customer.';
      const id = newCaseId();
      const n = JSON.parse(JSON.stringify(c));
      Object.assign(n, { id, bankId: f.bankId, amount: +f.amount || c.amount, status: 'draft', createdAt: now(), assignee: null, pickedAt: null, requests: [], bank: {}, decision: null, disbursal: null, eligibility: null, finalSet: false, unrouted: false, linked: [c.id, ...c.linked], docs: c.docs.filter((d) => d.status !== 'superseded').map((d) => ({ ...d, status: 'uploaded', comment: '' })) });
      c.linked.forEach((lid) => getCase(lid)?.linked.push(id)); c.linked.push(id);
      S.cases.unshift(n); log(n, `Copied from ${c.id} for ${bank(f.bankId).name}`); log(c, `Copied to ${bank(f.bankId).name} as ${id}`);
      submitCase(n, ''); location.hash = '#case/' + id; toast('Linked case created and submitted');
    } });
  },
  followUpCase(ds) { const c = getCase(ds.case); modal({ title: 'Follow-up owner for this case', body: `<label class="field">Who chases the customer for documents and bank queries<select name="mode"><option value="">Use ${esc(salesOf(c).name)}'s default (${salesOf(c).followUp === 'sales' ? 'Sales Executive' : 'Backend Executive'})</option><option value="sales" ${c.followUpOwner === 'sales' ? 'selected' : ''}>Sales Executive follows up</option><option value="backend" ${c.followUpOwner === 'backend' ? 'selected' : ''}>Backend Executive follows up</option></select></label><label class="field">Reason<input name="reason"></label>`, submit: 'Save', onSubmit(f) { c.followUpOwner = f.mode || null; log(c, `Follow-up owner set to ${f.mode ? (f.mode === 'sales' ? 'Sales Executive' : 'Backend Executive') : 'default'}${f.reason ? ': ' + f.reason : ''}`); } }); },
  tab(ds) { caseTab = ds.tab; render(); },
  readAll() { S.notifications.forEach((n) => { if (n.userId === S.me) n.read = true; }); save(); render(); openDrawer(); },
  openNotif(ds) { const n = S.notifications.find((x) => x.id === ds.id); n.read = true; save(); closeDrawer(); if (n.caseId && getCase(n.caseId)) location.hash = '#case/' + n.caseId; else render(); },
  email(ds) { const e = S.emails[+ds.i]; modal({ title: e.subject, body: `<div class="email"><div><b>To:</b> ${esc(e.to)}</div>${e.cc ? `<div><b>Cc:</b> ${esc(e.cc)}</div>` : ''}<div><b>Sent:</b> ${dt(e.at)}</div><hr style="border:0;border-top:1px solid var(--line);width:100%"><pre>${esc(e.body)}</pre></div>`, submit: '' }); },
};

function uploadDoc(c, type, file, reqId) {
  const d = { id: 'd' + Math.random().toString(36).slice(2, 8), type, name: file ? file.name : `${type}_sample.pdf`, by: S.me, at: now(), status: 'uploaded', comment: '', scanning: true };
  if (file && file.type.startsWith('image/')) { const fr = new FileReader(); fr.onload = () => { previews[d.id] = fr.result; render(); }; fr.readAsDataURL(file); }
  c.docs.push(d); render();
  setTimeout(() => {
    d.scanning = false;
    const n = c.status === 'draft' && docType(type)?.ocr ? applyOcr(c, type) : 0;
    log(c, `Uploaded ${docLabel(type)}${n ? `; OCR read ${n} field${n > 1 ? 's' : ''}` : ''}`);
    save(); render();
    toast(n ? `OCR read ${n} field${n > 1 ? 's' : ''} from ${docLabel(type)}. Please check them.` : `${docLabel(type)} uploaded`);
  }, 1400);
}

const caseTable = (list, cols = 'full') => list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Case</th><th>Customer</th><th>Product</th><th>Bank</th><th>Amount</th><th>Status</th>${cols === 'full' ? '<th>Sales</th><th>Backend</th>' : ''}<th>Updated</th></tr></thead><tbody>${list.map((c) => caseRow(c, cols)).join('')}</tbody></table></div>` : '<p class="empty">No cases here.</p>';

function slaBreaches(list) {
  const out = [];
  list.forEach((c) => {
    if (c.status === 'submitted' && hoursSince(c.submittedAt) > slaH('pickup')) out.push({ c, what: `Not picked up for ${Math.round(hoursSince(c.submittedAt))} h (target ${slaH('pickup')} h)` });
    if (c.status === 'processing' && c.pickedAt && hoursSince(c.pickedAt) > slaH('verify')) out.push({ c, what: `In verification for ${Math.round(hoursSince(c.pickedAt))} h (target ${slaH('verify')} h)` });
    if (c.status === 'ready' && c.eligibility && hoursSince(c.eligibility.at) > slaH('login')) out.push({ c, what: `Waiting for bank login ${Math.round(hoursSince(c.eligibility.at))} h` });
    c.requests.filter((r) => r.status === 'open' && r.due < now()).forEach((r) => out.push({ c, what: `${r.kind === 'docs' ? 'Document request' : 'Bank query'} overdue (owner ${user(r.owner).name})` }));
    if (['review', 'query'].includes(c.status) && hoursSince(c.portalCheckedAt || 0) > slaH('portal')) out.push({ c, what: 'Bank portal not checked in the last day' });
  });
  return out;
}

    const q = queueCases();
    return `<div class="page-head"><div><h1>Processing queue</h1><p class="muted">Submitted cases for ${myBanks(u).map((b) => bank(b).name).join(', ')}. Oldest first. Pick a case to make it yours.</p></div></div>
      <div class="card card--flush">${q.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Case</th><th>Customer</th><th>Product</th><th>Bank</th><th>Amount</th><th>Waiting</th><th></th></tr></thead><tbody>${q.sort((a, b) => a.submittedAt - b.submittedAt).map((c) => `<tr><td><a href="#case/${c.id}"><b>${c.id}</b></a></td><td>${esc(c.applicant.name)}</td><td>${c.product}</td><td>${bank(c.bankId).name}</td><td class="num">${amt(c.amount)}</td><td><span class="chip ${hoursSince(c.submittedAt) > slaH('pickup') ? 'chip--bad' : 'chip--info'}">${ago(c.submittedAt).replace(' ago', '')}</span></td><td><button class="btn btn--brand btn--sm" data-act="assignMe" data-case="${c.id}">Assign to me</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Queue is empty. New cases for your banks appear here.</p>'}</div>`;
  }
  const waiting = S.cases.filter((c) => c.status === 'submitted');
  return `<div class="page-head"><div><h1>Processing queue</h1><p class="muted">Every submitted case not yet picked up. Unrouted cases have no available Backend Executive for their bank.</p></div></div>
    <div class="card card--flush">${waiting.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Case</th><th>Customer</th><th>Bank</th><th>Visible to</th><th>Waiting</th><th></th></tr></thead><tbody>${waiting.map((c) => { const pool = S.users.filter((x) => inMyQueue(c, x)); return `<tr><td><a href="#case/${c.id}"><b>${c.id}</b></a></td><td>${esc(c.applicant.name)}</td><td>${bank(c.bankId).name}</td><td>${pool.length ? pool.map((x) => x.name).join(', ') : '<span class="chip chip--bad">unrouted</span>'}</td><td>${ago(c.submittedAt).replace(' ago', '')}</td><td><button class="btn btn--ghost btn--sm" data-act="reassign" data-case="${c.id}">Assign</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="empty">No cases waiting for pickup.</p>'}</div>`;
}

function viewTasks() {
  const t = myTasks();
  return `<div class="page-head"><div><h1>My tasks</h1><p class="muted">Document requests and bank queries where you are the follow-up owner, plus responses waiting to go on a bank portal.</p></div></div>
    ${t.length ? t.map(({ c, r }) => `<div class="card req ${r.status === 'open' ? 'req--open' : ''}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${esc(c.applicant.name)}</b> <span class="muted small">· <a href="#case/${c.id}">${c.id}</a> · ${c.product} · ${bank(c.bankId).name}</span></div><span class="chip ${r.due < now() ? 'chip--bad' : 'chip--warn'}">${r.kind === 'docs' ? 'Documents' : 'Bank query'} · due ${day(r.due)}</span></div><p class="small">${esc(r.note || '')}</p><p class="small"><b>Needed:</b> ${r.items.map(docLabel).join(', ') || 'clarification'}</p><p class="small muted">Customer mobile: <b class="num" style="user-select:all">${c.applicant.mobile}</b></p><div class="actions">${r.status === 'open' ? `<button class="btn btn--primary btn--sm" data-act="respond" data-case="${c.id}" data-req="${r.id}">${r.kind === 'docs' ? 'Upload documents' : 'Upload response'}</button>` : ''}${r.status === 'responded' && c.assignee === S.me ? `<button class="btn btn--brand btn--sm" data-act="resolveQuery" data-case="${c.id}" data-req="${r.id}">Submitted on bank portal</button>` : ''}<a class="btn btn--ghost btn--sm" href="#case/${c.id}">Open case</a></div></div>`).join('') : '<div class="card"><p class="empty">Nothing waiting on you.</p></div>'}`;
}

/* ---------- case page ---------- */
function nextStep(c) {
  const be = user(c.assignee), owner = user(followUpOwner(c)), b = bank(c.bankId);
  switch (c.status) {
    case 'draft': return ['Sales Executive', 'Upload documents, check the details OCR read, add the bank and amount, then submit.'];
    case 'submitted': return c.unrouted ? ['Manager', `No Backend Executive is available for ${b.name}. Assign one.`] : ['Backend Executive', `Waiting for an executive allocated to ${b.name} to pick it up (target ${slaH('pickup')} hours).`];
    case 'processing': return [be?.name || 'Backend Executive', 'Verify each document, then mark eligible or request documents.'];
    case 'docs-pending': return [user(openReqs(c, 'docs')[0]?.owner)?.name || owner.name, 'Collect the requested documents from the customer and upload them on the request.'];
    case 'not-eligible': return c.eligibility?.confirmed ? ['Sales Executive', 'Closed as not eligible. Copy the file to another bank if suitable.'] : ['Manager', 'Confirm not eligible, or send the case back to processing.'];
    case 'ready': return [be?.name || 'Backend Executive', c.finalSet ? `Log the file on the ${b.name} portal and enter the reference number.` : 'Upload the final document set for the bank.'];
    case 'review': return [be?.name || 'Backend Executive', 'Check the bank portal every working day. Log any query or record the decision.'];
    case 'query': { const r = openReqs(c, 'query')[0]; return r?.status === 'responded' ? [be?.name, 'Submit the response on the bank portal and mark it resolved.'] : [user(r?.owner)?.name || owner.name, "Get the answers or documents for the bank's query and upload them."]; }
    case 'sanctioned': return [be?.name || 'Backend Executive', 'Record the disbursal when the bank pays out.'];
    default: return ['', 'This case is closed.'];
  }
}

function caseActions(c) {
  const u = me(), b = [];
  const btn = (act, label, cls = 'btn--ghost', extra = '') => `<button class="btn ${cls}" data-act="${act}" data-case="${c.id}" ${extra}>${label}</button>`;
  const ownSales = u.role === 'sales' && c.createdBy === u.id;
  if (c.status === 'draft' && (ownSales || isMgr())) b.push(btn('submit', 'Submit case', 'btn--primary'));
  if (inMyQueue(c)) b.push(btn('assignMe', 'Assign to me', 'btn--primary'));
  if (c.status === 'processing' && canWork(c) && u.role !== 'sales') { b.push(btn('eligible', 'Mark eligible', 'btn--primary'), btn('requestDocs', 'Request documents'), btn('notEligible', 'Not eligible', 'btn--danger')); }
  if (c.status === 'docs-pending' && canWork(c) && u.role !== 'sales') b.push(btn('requestDocs', 'Request more documents'));
  if (c.status === 'not-eligible' && !c.eligibility?.confirmed && isMgr()) b.push(btn('confirmNE', 'Confirm not eligible', 'btn--danger'), btn('sendBack', 'Send back to processing'));
  if (c.status === 'ready' && canWork(c) && u.role !== 'sales') b.push(c.finalSet ? btn('reference', 'Enter bank reference number', 'btn--primary') : btn('finalSet', 'Upload final document set', 'btn--primary'));
  if (['review', 'query'].includes(c.status) && canWork(c) && u.role !== 'sales') b.push(btn('decision', 'Record bank decision', 'btn--primary'), btn('query', 'Log bank query'), btn('checked', 'Portal checked, no change'));
  if (c.status === 'sanctioned' && canWork(c) && u.role !== 'sales') b.push(btn('disburse', 'Record disbursal', 'btn--primary'));
  if (['submitted', 'processing', 'docs-pending', 'ready', 'review', 'query'].includes(c.status) && isMgr()) b.push(btn('reassign', c.assignee ? 'Reassign' : 'Assign'));
  if (c.status !== 'draft' && (ownSales || isMgr())) b.push(btn('copyBank', 'Copy to another bank'));
  if ([...OPEN, 'draft'].includes(c.status) && (isMgr() || isAssignee(c) || (c.status === 'draft' && ownSales))) b.push(btn('withdraw', 'Withdraw', 'btn--danger'));
  if ((['rejected', 'disbursed', 'withdrawn'].includes(c.status) || (c.status === 'not-eligible' && c.eligibility?.confirmed)) && isRole('admin', 'superadmin')) b.push(btn('reopen', 'Reopen'));
  if (isRole('superadmin')) b.push(btn('deleteCase', 'Delete case', 'btn--danger'));
  return b.join('');
}

function draftEditor(c) {
  const a = c.applicant, canEdit = c.createdBy === S.me || isMgr();
  const types = [...new Set([...requiredDocs(c.product, c.bankId), 'address', 'itr', 'photo'])];
  const docTile = (type) => {
    const ds = c.docs.filter((d) => d.type === type);
    const req = requiredDocs(c.product, c.bankId).includes(type);
    if (!ds.length) return `<div class="doc doc--missing"><div class="doc__thumb"><span class="muted small">Not uploaded</span></div><div class="doc__name">${docLabel(type)} ${req ? '<span class="tag">required</span>' : ''}</div>${canEdit ? `<div class="doc__actions"><button class="btn btn--ghost btn--sm" data-act="pickFile" data-case="${c.id}" data-type="${type}">Upload file</button><button class="btn btn--ghost btn--sm" data-act="sample" data-case="${c.id}" data-type="${type}">Use sample</button></div>` : ''}</div>`;
    return ds.map((d) => `<div class="doc"><div class="doc__thumb ${d.scanning ? 'scanning' : ''}">${previews[d.id] ? `<img src="${previews[d.id]}" alt="">` : docMock(type)}</div><div class="doc__name">${docLabel(type)}</div><span class="tiny muted">${esc(d.name)} · ${d.scanning ? 'reading with OCR…' : ago(d.at)}</span></div>`).join('');
  };
  const fieldHtml = ([k, label]) => {
    const meta = c.ocr[k], conf = conflicts(c, k);
    const src = meta?.source === 'manual' ? '<span class="src src--manual">typed or corrected</span>' : meta?.source ? `<span class="src src--${meta.conf}">${meta.conf === 'check' ? 'Check · ' : 'OCR · '}from ${docLabel(meta.source)}</span>` : '<span class="src src--manual">&nbsp;</span>';
    const val = k === 'aadhaar' && a[k] ? a[k] : a[k] ?? '';
    return `<div class="ocr-field ${k === 'address' ? 'full' : ''}"><label class="field">${label}${k === 'aadhaar' ? ' <span class="tiny muted">(full number never stored)</span>' : ''}<input data-field="${k}" data-case="${c.id}" value="${esc(val)}" ${k === 'dob' ? 'type="date"' : ''} class="${meta?.conf === 'check' && meta?.source !== 'manual' ? 'check' : ''}" ${canEdit ? '' : 'disabled'} ${k === 'aadhaar' ? 'maxlength="4" inputmode="numeric"' : ''}></label>${src}${conf ? `<div class="note note--warn small">Documents disagree. Pick the correct value:<div class="pick" style="margin-top:6px">${conf.map((v) => `<button type="button" data-pickval="${esc(v.value)}" data-field="${k}" data-case="${c.id}" aria-pressed="${norm(v.value) === norm(a[k])}">${esc(v.value)} <span class="tiny muted">(${docLabel(v.src)})</span></button>`).join('')}</div></div>` : ''}</div>`;
  };
  const miss = missingDocs(c);
  return `<div class="grid2" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)">
    <div class="card"><div class="card__head"><h2>1. Upload documents</h2><span class="small muted">OCR reads each one</span></div><div class="doc-grid">${types.map(docTile).join('')}</div></div>
    <div class="card"><div class="card__head"><h2>2. Check customer details</h2><span class="small muted">Amber = please check</span></div><div class="form-grid">${OCR_FIELDS.map(fieldHtml).join('')}</div></div>
  </div>
  <div class="card"><div class="card__head"><h2>3. Loan details</h2></div><div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <label class="field">Product<select data-loan="product" data-case="${c.id}" ${canEdit ? '' : 'disabled'}>${productNames().map((p) => `<option ${p === c.product ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
    <label class="field">Bank applied for<select data-loan="bankId" data-case="${c.id}" ${canEdit ? '' : 'disabled'}><option value="">Choose bank</option>${banksFor(c.product).map((b) => `<option value="${b.id}" ${b.id === c.bankId ? 'selected' : ''}>${b.name}</option>`).join('')}</select></label>
    <label class="field">Loan amount (₹)<input data-loan="amount" data-case="${c.id}" inputmode="numeric" value="${esc(c.amount)}" ${canEdit ? '' : 'disabled'}></label>
    <label class="field">Tenure (years)<input data-loan="tenure" data-case="${c.id}" inputmode="numeric" value="${esc(c.tenure)}" ${canEdit ? '' : 'disabled'}></label>
    <label class="field" style="grid-column:1/-1">Purpose<input data-loan="purpose" data-case="${c.id}" value="${esc(c.purpose)}" ${canEdit ? '' : 'disabled'}></label>
  </div>
  ${(() => { const bp = bankProduct(c.bankId, c.product); if (!c.bankId) return `<div class="note note--info small" style="margin-top:14px">${banksFor(c.product).length} banks offer ${c.product}: ${banksFor(c.product).map((b) => b.name).join(', ')}.</div>`; if (!bp) return ''; const out = +c.amount && (+c.amount < bp.minAmount || +c.amount > bp.maxAmount); return `<div class="note ${out ? 'note--warn' : 'note--info'} small" style="margin-top:14px"><b>${esc(bp.scheme)}</b> · amount ${amt(bp.minAmount)} to ${amt(bp.maxAmount)} · tenure ${bp.minTenure} to ${bp.maxTenure} years · interest ${bp.roiFrom}% to ${bp.roiTo}% · fee ${esc(bp.processingFee)}${bp.minIncome ? ' · minimum income ' + inr(bp.minIncome) + ' a month' : ''}${bp.extraDocs.length ? ` · this bank also needs: ${bp.extraDocs.map(docLabel).join(', ')}` : ''}${out ? '<br><b>The amount is outside this bank\'s range.</b>' : ''}</div>`; })()}
  <div class="note" style="margin-top:14px"><b>Document checklist for ${c.product}${c.bankId ? ' at ' + esc(bank(c.bankId).name) : ''}:</b><ul class="checklist" style="margin-top:8px">${requiredDocs(c.product, c.bankId).map((t) => `<li><span class="tick ${c.docs.some((d) => d.type === t) ? 'tick--yes' : 'tick--no'}">${c.docs.some((d) => d.type === t) ? '✓' : ''}</span>${docLabel(t)}</li>`).join('')}</ul></div>
  <div class="actions" style="margin-top:14px;justify-content:space-between;align-items:center"><span class="small muted">${miss.length ? `${miss.length} required document${miss.length > 1 ? 's' : ''} missing` : 'All required documents uploaded'} · saved automatically</span>${canEdit ? `<button class="btn btn--primary" data-act="submit" data-case="${c.id}">Submit case</button>` : ''}</div></div>`;
}

function tabOverview(c) {
  const a = c.applicant;
  const row = (k, l) => `<dt>${l}</dt><dd>${esc(k === 'aadhaar' && a[k] ? 'XXXX XXXX ' + a[k] : ['netSalary', 'grossSalary', 'annualIncome', 'avgBalance'].includes(k) ? inr(a[k]) : k === 'dob' && a[k] ? day(Date.parse(a[k])) : a[k] || '—')}${c.ocr[k]?.source && c.ocr[k].source !== 'manual' ? ` <span class="tag">OCR</span>` : ''}</dd>`;
  return `<div class="grid2"><div class="card"><h3 style="margin-bottom:12px">Applicant</h3><dl class="kv">${OCR_FIELDS.map(([k, l]) => row(k, l)).join('')}</dl></div>
    <div style="display:grid;gap:20px;align-content:start"><div class="card"><h3 style="margin-bottom:12px">Loan request</h3><dl class="kv"><dt>Product</dt><dd>${c.product}</dd><dt>Bank</dt><dd>${bank(c.bankId)?.name || '—'}</dd><dt>Amount</dt><dd>${amt(c.amount)}</dd><dt>Tenure</dt><dd>${c.tenure || '—'} years</dd><dt>Purpose</dt><dd>${esc(c.purpose || '—')}</dd><dt>Lead source</dt><dd>${esc(c.source || '—')}${c.partnerId ? ' · ' + esc(M().partners.find((x) => x.id === c.partnerId)?.name || '') : ''}</dd>${c.override ? `<dt>Submitted with</dt><dd>missing items: ${esc(c.override)}</dd>` : ''}</dl></div>
    <div class="card"><h3 style="margin-bottom:12px">Processing</h3><dl class="kv"><dt>Eligibility</dt><dd>${c.eligibility ? (c.eligibility.value === 'eligible' ? 'Eligible' : 'Not eligible' + (c.eligibility.confirmed ? ' (confirmed)' : ' (awaiting manager)')) + (c.eligibility.reason ? ': ' + esc(c.eligibility.reason) : '') : '—'}</dd><dt>Final set uploaded</dt><dd>${c.finalSet ? 'Yes' : 'No'}</dd><dt>Follow-up owner</dt><dd>${user(followUpOwner(c)).name}${c.followUpOwner ? ' (set on this case)' : ' (default)'} ${(isMgr() || isAssignee(c)) && c.status !== 'draft' ? `<button class="btn btn--ghost btn--sm" data-act="followUpCase" data-case="${c.id}">Change</button>` : ''}</dd>${c.withdrawReason ? `<dt>Withdrawn</dt><dd>${esc(c.withdrawReason)}</dd>` : ''}</dl></div></div></div>`;
}

function tabDocs(c) {
  const verifying = ['processing', 'docs-pending'].includes(c.status) && canWork(c) && me().role !== 'sales';
  const canDownload = me().role !== 'sales';
  const docs = c.docs.filter((d) => d.status !== 'superseded');
  const miss = missingDocs(c);
  const st = { uploaded: ['to verify', 'info'], verified: ['Verified', 'good'], replace: ['Needs replacement', 'bad'] };
  return `${c.override ? `<div class="note note--warn small">Submitted with missing items. Sales Executive's reason: ${esc(c.override)}</div>` : ''}
    <div class="doc-grid">${docs.map((d) => `<div class="doc"><div class="doc__thumb ${d.scanning ? 'scanning' : ''}">${previews[d.id] ? `<img src="${previews[d.id]}" alt="">` : docMock(d.type)}</div><div style="display:flex;justify-content:space-between;gap:6px;align-items:start"><span class="doc__name">${docLabel(d.type)}</span><span class="chip chip--${st[d.status]?.[1] || 'info'}">${st[d.status]?.[0] || d.status}</span></div><span class="tiny muted">${esc(d.name)} · ${user(d.by)?.name || ''} · ${ago(d.at)}</span>${d.comment ? `<span class="small" style="color:var(--bad)">${esc(d.comment)}</span>` : ''}<div class="doc__actions">${verifying && d.status !== 'verified' ? `<button class="btn btn--brand btn--sm" data-act="verifyDoc" data-case="${c.id}" data-doc="${d.id}">Verify</button>` : ''}${verifying && d.status !== 'replace' ? `<button class="btn btn--ghost btn--sm" data-act="rejectDoc" data-case="${c.id}" data-doc="${d.id}">Needs replacement</button>` : ''}${canDownload ? `<button class="btn btn--ghost btn--sm" data-act="download" data-case="${c.id}" data-doc="${d.id}">Download</button>` : '<span class="tiny muted">View only</span>'}${isRole('superadmin') ? `<button class="btn btn--danger btn--sm" data-act="deleteDoc" data-case="${c.id}" data-doc="${d.id}">Delete</button>` : ''}</div></div>`).join('')}
    ${miss.map((t) => `<div class="doc doc--missing"><div class="doc__thumb"><span class="muted small">Missing</span></div><div class="doc__name">${docLabel(t)} <span class="tag">required</span></div></div>`).join('')}</div>`;
}

function tabRequests(c) {
  if (!c.requests.length) return '<p class="empty">No document requests or bank queries on this case.</p>';
  return c.requests.map((r) => {
    const canResp = r.status === 'open' && (r.owner === S.me || isMgr());
    const canResolve = r.kind === 'query' && r.status === 'responded' && canWork(c) && me().role !== 'sales';
    return `<div class="req ${r.status !== 'done' ? 'req--open' : ''}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${r.kind === 'docs' ? 'Document request' : 'Bank query'}</b><span class="chip ${r.status === 'done' ? 'chip--good' : r.due < now() ? 'chip--bad' : 'chip--warn'}">${r.status === 'done' ? 'Closed ' + day(r.doneAt) : r.status === 'responded' ? 'Response uploaded' : 'Open · due ' + day(r.due)}</span></div>${r.note ? `<p class="small">${esc(r.note)}</p>` : ''}<p class="small"><b>Needed:</b> ${r.items.map(docLabel).join(', ') || 'clarification'}</p><p class="small muted">Raised by ${user(r.by)?.name} on ${dt(r.createdAt)} · follow-up owner <b>${user(r.owner)?.name}</b>${r.comment ? ' · reply: ' + esc(r.comment) : ''}</p>${canResp || canResolve ? `<div class="actions">${canResp ? `<button class="btn btn--primary btn--sm" data-act="respond" data-case="${c.id}" data-req="${r.id}">${r.kind === 'docs' ? 'Upload documents' : 'Upload response'}</button>` : ''}${canResolve ? `<button class="btn btn--brand btn--sm" data-act="resolveQuery" data-case="${c.id}" data-req="${r.id}">Submitted on bank portal</button>` : ''}</div>` : ''}</div>`;
  }).join('');
}

function tabBank(c) {
  const b = bank(c.bankId), emails = S.emails.map((e, i) => ({ e, i })).filter(({ e }) => e.spoc && e.caseId === c.id);
  const d = c.decision, x = c.disbursal;
  return `<div class="grid2"><div class="card"><h3 style="margin-bottom:12px">Bank login</h3>${c.bank.ref ? `<dl class="kv"><dt>Bank</dt><dd>${b.name}</dd><dt>Reference number</dt><dd class="num">${esc(c.bank.ref)}</dd><dt>Login date</dt><dd>${day(c.bank.loginDate)}</dd><dt>Branch / scheme</dt><dd>${esc(c.bank.branch || '—')}</dd><dt>SPOC emailed</dt><dd>${dt(c.bank.spocAt)}</dd><dt>Portal last checked</dt><dd>${c.portalCheckedAt ? ago(c.portalCheckedAt) : '—'}</dd></dl>` : `<p class="muted">Not logged with ${b?.name || 'a bank'} yet.</p>`}
      ${emails.length ? `<div style="margin-top:12px;display:grid;gap:8px">${emails.map(({ e, i }) => `<button class="email" style="text-align:left;cursor:pointer" data-act="email" data-i="${i}"><b>Email to ${esc(e.to)}</b><span class="small muted">${esc(e.subject)}</span></button>`).join('')}</div>` : ''}</div>
    <div class="card"><h3 style="margin-bottom:12px">Decision and disbursal</h3>${d ? (d.type === 'sanctioned' ? `<dl class="kv"><dt>Decision</dt><dd>${chip('sanctioned')}</dd><dt>Amount</dt><dd>${amt(d.amount)}</dd><dt>Interest rate</dt><dd>${d.rate}% a year</dd><dt>Tenure</dt><dd>${d.tenure || '—'} years</dd><dt>Processing fee</dt><dd>${esc(d.fee || '—')}</dd><dt>Conditions</dt><dd>${esc(d.conditions || '—')}</dd><dt>Date</dt><dd>${day(d.date)}</dd><dt>Letter</dt><dd>${esc(d.letter || 'sanction_letter.pdf')}</dd></dl>` : `<dl class="kv"><dt>Decision</dt><dd>${chip('rejected')}</dd><dt>Reason</dt><dd>${esc(d.reason)}</dd><dt>Date</dt><dd>${day(d.date)}</dd></dl>`) : '<p class="muted">No decision yet.</p>'}
      ${x ? `<dl class="kv" style="margin-top:14px"><dt>Disbursed</dt><dd>${amt(x.amount)} (${esc(x.mode)})</dd><dt>Date</dt><dd>${day(x.date)}</dd><dt>Loan account</dt><dd class="num">${esc(x.lan)}</dd></dl>` : ''}</div></div>
    ${canSeeMoney() ? commissionCard(c) : ''}
    <div class="card"><h3 style="margin-bottom:10px">Bank queries on this case</h3>${c.requests.filter((r) => r.kind === 'query').length ? c.requests.filter((r) => r.kind === 'query').map((r) => `<p class="small" style="padding:8px 0;border-top:1px solid var(--line)"><b>${day(r.createdAt)}</b> · ${esc(r.note)} <span class="chip ${r.status === 'done' ? 'chip--good' : 'chip--warn'}">${r.status === 'done' ? 'resolved' : r.status}</span></p>`).join('') : '<p class="muted small">None.</p>'}</div>`;
}

function tabTimeline(c) {
  const items = S.audit.filter((x) => x.caseId === c.id).sort((a, b) => b.at - a.at);
  return `<div class="card"><ul class="timeline">${items.map((x) => `<li><span></span><div><b>${esc(x.text)}</b><div class="tiny muted">${x.by === 'system' ? 'CRM' : user(x.by)?.name || ''} · ${dt(x.at)}</div></div></li>`).join('')}</ul></div>`;
}

function viewCase(id) {
  const c = getCase(id);
  if (!c) return '<div class="card"><p class="empty">Case not found.</p></div>';
  if (!canSee(c)) return `<div class="card"><p class="empty">${esc(me().name)} (${ROLES[me().role]}) cannot see this case. Switch user at the top to see it.</p></div>`;
  const b = bank(c.bankId), se = salesOf(c), be = user(c.assignee);
  const stage = STAGE_OF[c.status], closedBad = ['rejected', 'withdrawn'].includes(c.status) || (c.status === 'not-eligible' && c.eligibility?.confirmed);
  const [who, what] = nextStep(c);
  const head = `<div class="case-head"><a href="#cases" class="small">← All cases</a><div class="case-title"><h1>${esc(c.applicant.name || 'New customer')}</h1>${chip(c.status, c.status === 'not-eligible' && !c.eligibility?.confirmed ? ' · awaiting manager' : '')}${c.unrouted && c.status === 'submitted' ? '<span class="chip chip--bad">unrouted</span>' : ''}</div>
    <div class="meta-row"><span><b class="num">${c.id}</b></span><span>${c.product}</span><span>${b ? b.name : 'Bank not chosen'}</span><span><b>${amt(c.amount)}</b></span><span>Mobile <b class="num">${esc(c.applicant.mobile)}</b></span>${c.bank.ref ? `<span>Bank ref <b class="num">${esc(c.bank.ref)}</b></span>` : ''}</div>
    ${c.status !== 'draft' ? `<div class="stepper" aria-label="Progress">${STAGES.map(([k, l], i) => `<div class="${closedBad && i >= stage ? '' : i < stage || (i === stage && ['disbursed'].includes(c.status)) ? 'done' : i === stage ? 'now' : ''}"><i></i><span>${l}</span></div>`).join('')}</div>` : ''}
    <div class="actions">${caseActions(c)}</div></div>`;
  if (c.status === 'draft') return head + draftEditor(c);
  const reqCount = openReqs(c).length;
  const tabs = [['overview', 'Overview'], ['docs', `Documents (${c.docs.filter((d) => d.status !== 'superseded').length})`], ['requests', `Requests and queries${reqCount ? ` (${reqCount} open)` : ''}`], ['bank', 'Bank'], ['timeline', 'Timeline']];
  if (!tabs.some(([k]) => k === caseTab)) caseTab = 'overview';
  const panel = { overview: tabOverview, docs: tabDocs, requests: tabRequests, bank: tabBank, timeline: tabTimeline }[caseTab](c);
  const linked = c.linked.map(getCase).filter(Boolean);
  return `${head}<div class="case-body"><div style="min-width:0"><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === caseTab}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div><div class="tabpanel">${panel}</div></div>
    <aside style="display:grid;gap:16px"><div class="card next"><p class="tiny muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Next step${who ? ' · ' + esc(who) : ''}</p><p style="margin-top:6px;font-weight:600">${esc(what)}</p></div>
    <div class="card"><h3 style="margin-bottom:12px">People</h3><div class="people"><div class="person">${avatar(se)}<div><b>${se.name}</b><div class="tiny muted">Sales Executive · follow-up: ${se.followUp === 'sales' ? 'self' : 'backend'}</div></div></div>${be ? `<div class="person">${avatar(be)}<div><b>${be.name}</b><div class="tiny muted">Backend Executive${be.label ? ' · ' + be.label : ''}</div></div></div>` : '<p class="small muted">No Backend Executive yet.</p>'}${b ? `<div class="person"><span class="avatar" style="background:var(--surface-2);color:var(--ink)">B${b.no}</span><div><b>${spocsFor(b, c.product).map((s) => s.name).join(', ')}</b><div class="tiny muted">Bank SPOC · ${b.name}</div></div></div>` : ''}</div></div>
    ${linked.length ? `<div class="card"><h3 style="margin-bottom:10px">Linked cases</h3>${linked.map((l) => `<p class="small" style="padding:6px 0"><a href="#case/${l.id}">${l.id}</a> · ${bank(l.bankId)?.name} ${canSee(l) ? chip(l.status) : ''}</p>`).join('')}</div>` : ''}</aside></div>`;

function viewEmails() {

/* =================== MASTERS: access + generic screens =================== */
function masterLevel(key, u = me()) {

}
const canViewMaster = (key) => masterLevel(key) !== 'none';
const canEditMaster = (key) => masterLevel(key) === 'edit';
const mrecs = (key) => (key === 'users' ? S.users : key === 'settings' ? [M().settings] : M()[key]);
function refOptions(ref) {
  if (ref === 'users') return S.users.filter((u) => u.active !== false).map((u) => [u.id, `${u.name} · ${ROLES[u.role]}`]);
  if (ref === 'banks') return M().banks.map((b) => [b.id, b.name + (b.active ? '' : ' (inactive)')]);
  if (ref === 'products') return M().products.map((p) => [p.id, p.name + (p.active ? '' : ' (inactive)')]);
  if (ref === 'docTypes') return M().docTypes.map((d) => [d.id, d.name + (d.active ? '' : ' (inactive)')]);
  return [];
}
const refLabel = (ref, id) => (refOptions(ref).find(([v]) => v === id)?.[1] || '').replace(/ · .*$/, '').replace(' (inactive)', '') || '—';
const optPairs = (f) => (f.opts ? f.opts().map((o) => (Array.isArray(o) ? o : [o, o])) : refOptions(f.ref));

  if (f.t === 'ref') return esc(refLabel(f.ref, v));
  if (f.t === 'multi') { const arr = v || []; if (!arr.length) return f.k === 'products' ? '<span class="muted">All products</span>' : '<span class="muted">—</span>'; const labels = arr.map((x) => (f.ref ? refLabel(f.ref, x) : x)); return esc(labels.slice(0, 3).join(', ') + (labels.length > 3 ? ` +${labels.length - 3}` : '')); }
  if (f.t === 'select') return esc(optPairs(f).find(([o]) => o === v)?.[1] || v || '—');
  if (f.t === 'date') return v ? day(Date.parse(v)) : '—';
  if (f.t === 'number') { if (v === '' || v == null) return '—'; if (/amount/i.test(f.k)) return amt(v); if (f.k === 'payout' || /^roi/.test(f.k)) return `${v}%`; return esc(v); }
  return esc(v ?? '—');
}
function fieldInput(f, rec, ro) {
  const v = rec[f.k], id = 'mf-' + f.k, dis = ro || (f.lock && rec.id) ? 'disabled' : '';
  const wide = ['textarea', 'multi'].includes(f.t) ? 'full' : '';
  switch (f.t) {
    case 'textarea': return `<label class="field full">${f.l}<textarea id="${id}" name="${f.k}" rows="${f.k === 'body' ? 10 : 3}" ${dis}>${esc(v ?? '')}</textarea></label>`;
    case 'bool': return `<label class="switch ${wide}" style="grid-column:1/-1"><input type="checkbox" name="${f.k}" ${v === false || (v == null && f.k !== 'active') ? '' : 'checked'} ${dis}> ${f.l}</label>`;
    case 'select': case 'ref': return `<label class="field">${f.l}<select id="${id}" name="${f.k}" ${dis}>${f.req ? '' : '<option value="">—</option>'}${optPairs(f).map(([o, l]) => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
    case 'multi': return `<div class="field full">${f.l}<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;font-weight:500">${optPairs(f).map(([o, l]) => `<label class="switch"><input type="checkbox" name="${f.k}" value="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''} ${dis}> ${esc(l)}</label>`).join('')}</div></div>`;
    default: return `<label class="field">${f.l}<input id="${id}" name="${f.k}" type="${f.t === 'number' ? 'number' : f.t === 'email' ? 'email' : f.t === 'date' ? 'date' : 'text'}" ${f.t === 'number' ? 'step="any"' : ''} value="${esc(v ?? '')}" ${dis}></label>`;

function readForm(def, f, rec) {

function validate(def, data, rec) {

    if (fd.t === 'number' && v !== '' && v != null && (isNaN(v) || v < 0)) return `${fd.l} must be a positive number.`;
    if (fd.unique && v && mrecs(def.key).some((x) => x !== rec && String(x[fd.k]).toLowerCase() === String(v).toLowerCase())) return `Another record already has this ${fd.l.toLowerCase()}.`;
  }
  if (def.unique && mrecs(def.key).some((x) => x !== rec && def.unique.every((k) => x[k] === (data[k] ?? rec[k])))) return 'This combination already exists. Edit the existing entry instead.';
  if (def.key === 'bankProducts') { const d = { ...rec, ...data }; if (+d.minAmount > +d.maxAmount) return 'Minimum amount is above the maximum.'; if (+d.roiFrom > +d.roiTo) return 'Interest from is above interest up to.'; }
  if (def.key === 'users') { const d = { ...rec, ...data }; if (rec.id === S.me && d.active === false) return 'You cannot deactivate your own account.'; if (rec.id === S.me && d.role !== 'superadmin' && me().role === 'superadmin') return 'You cannot remove your own Super Admin role.'; }

function usage(key, rec) {

  if (key === 'products') { n.push(...S.cases.filter((c) => c.product === rec.name)); n.push(...M().bankProducts.filter((x) => x.productId === rec.id)); }
  if (key === 'docTypes') { n.push(...S.cases.flatMap((c) => c.docs).filter((d) => d.type === rec.id)); n.push(...M().products.filter((p) => p.requiredDocs.includes(rec.id))); }

function recTitle(def, rec) { return def.key === 'bankProducts' ? `${refLabel('banks', rec.bankId)} · ${refLabel('products', rec.productId)}` : def.key === 'spocs' ? `${rec.name} (${refLabel('banks', rec.bankId)})` : rec.name || rec.date || rec.id; }
function openRecord(key, id) {
  const def = MASTER[key], isNew = !id, ro = !canEditMaster(key);
  const rec = isNew ? (key === 'users' ? { active: true, role: 'sales', followUp: 'sales' } : { active: true }) : mrecs(key).find((x) => x.id === id);
  const used = isNew ? 0 : usage(key, rec);
  modal({
    title: isNew ? `Add to ${def.label.toLowerCase()}` : `${ro ? '' : 'Edit: '}${esc(recTitle(def, rec))}`, wide: true, submit: ro ? '' : isNew ? 'Add' : 'Save changes',
    body: `${ro ? '<div class="note note--info small">You can view this master but not change it. Ask the Super Admin for edit access.</div>' : ''}<div class="form-grid">${def.fields.map((f) => fieldInput(f, rec, ro)).join('')}</div>
      ${!isNew && !ro && me().role === 'superadmin' ? `<div class="note small" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>${used ? `Used by ${used} record${used > 1 ? 's' : ''}. Deactivate it instead of deleting.` : 'Not used anywhere yet. It can be deleted.'}</span>${used ? '' : `<button type="button" class="btn btn--danger btn--sm" data-act="delRecord" data-key="${key}" data-id="${rec.id}">Delete</button>`}</div>` : ''}`,
    onSubmit(f) {

  }
  let rows = mrecs(key);
  if (mfilter) { const q = mfilter.toLowerCase(); rows = rows.filter((r) => def.cols.some((k) => String(cellValue(def.fields.find((f) => f.k === k), r[k])).toLowerCase().includes(q))); }
  const colDefs = def.cols.map((k) => def.fields.find((f) => f.k === k));
  return `${head}<div class="card" style="padding:12px 16px"><label class="field">Search<input id="mq" value="${esc(mfilter)}" placeholder="Search ${def.label.toLowerCase()}"></label></div>
    <div class="card card--flush">${rows.length ? `<div class="table-wrap"><table class="tbl"><thead><tr>${colDefs.map((f) => `<th>${f.l.replace(/ \(.*\)$/, '')}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr class="link" data-act="openRecord" data-key="${key}" data-id="${r.id}" style="${r.active === false ? 'opacity:.6' : ''}">${colDefs.map((f) => `<td>${cellValue(f, r[f.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="empty">Nothing matches.</p>'}</div>
    <p class="tiny muted">${edit ? 'Click a row to edit. Records in use cannot be deleted; deactivate them instead. Every change is recorded in the audit log.' : 'Click a row to view details.'}</p>`;
}
function viewAccess() {
  if (me().role !== 'superadmin') return '<div class="card"><p class="empty">Only the Super Admin can change master access.</p></div>';
  const sel = (key, role) => { const v = S.masterAccess[key][role]; return `<select data-access="${key}|${role}" style="padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)">${[['none', 'No access'], ['view', 'View'], ['edit', 'Edit']].map(([o, l]) => `<option value="${o}" ${v === o ? 'selected' : ''}>${l}</option>`).join('')}</select>${MASTER[key].critical && role === 'admin' && v === 'edit' ? ' <span class="chip chip--warn">critical delegated</span>' : ''}`; };
  return `<a href="#masters" class="small">← Masters</a><div class="page-head"><div><h1>Master access</h1><p class="muted">Decide who can view or change each master. The Super Admin can always edit every master. Sales and Backend Executives never open masters; they only use the values in their screens.</p></div></div>
    <div class="card card--flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>Master</th><th>Type</th><th>Super Admin</th><th>Admin</th><th>Manager</th></tr></thead><tbody>${MGROUPS.map((g) => `<tr><td colspan="5" style="background:var(--surface-2);font-weight:700">${g}</td></tr>${MASTERS.filter((m) => m.group === g).map((m) => `<tr><td><b>${m.label}</b><div class="tiny muted">${m.desc}</div></td><td>${m.critical ? '<span class="chip chip--plain chip--bad">Critical</span>' : '<span class="chip chip--plain">Non-critical</span>'}</td><td><span class="chip chip--plain chip--good">Edit (always)</span></td><td>${sel(m.key, 'admin')}</td><td>${sel(m.key, 'manager')}</td></tr>`).join('')}`).join('')}</tbody></table></div></div>
    <div class="note small">Critical masters change money, security or who can do what: users, referral partners and their payout, banks, loan products, bank products and payouts, system settings. By default Admins can only view them.</div>`;
}

/* =================== COMMISSION TRACKING =================== */
const canSeeMoney = () => isRole('superadmin', 'admin');
const fyOf = (t) => { const d = new Date(t), y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return `${String(y).slice(2)}-${String(y + 1).slice(2)}`; };
const fyStart = (t = now()) => { const d = new Date(t), y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return new Date(y, 3, 1).getTime(); };
const bankProductAny = (bankId, productName) => { const p = productByName(productName); return p ? M().bankProducts.find((bp) => bp.bankId === bankId && bp.productId === p.id) : null; };
const partner = (id) => M().partners.find((x) => x.id === id);
function makeCommission(c) {
  const bp = bankProductAny(c.bankId, c.product), rate = +(bp?.payout) || 0, base = +c.disbursal.amount;
  const p = partner(c.partnerId), prate = p ? +(p.payout) || 0 : 0;
  return { rate, base, amount: Math.round((base * rate) / 100), partnerId: p ? p.id : null, partnerRate: prate, partnerAmount: Math.round((base * prate) / 100), status: 'expected', partnerStatus: p ? 'hold' : null, at: now() };
}
const COMM = { expected: ['Expected', 'info'], invoiced: ['Invoiced', 'warn'], received: ['Received', 'good'], short: ['Short paid', 'bad'] };
const PAYOUT = { hold: ['Waiting for bank payment', ''], due: ['Due to partner', 'warn'], paid: ['Paid', 'good'] };
const INV = { raised: ['Awaiting payment', 'warn'], paid: ['Paid', 'good'], short: ['Short paid', 'bad'] };
const tchip = ([label, tone]) => `<span class="chip ${tone ? 'chip--' + tone : ''}">${label}</span>`;
const invoice = (id) => S.invoices.find((x) => x.id === id);
const commCases = () => S.cases.filter((c) => c.commission);

function commissionCard(c) {
  const k = c.commission; if (!k) return '';
  const inv = k.invoiceId ? invoice(k.invoiceId) : null, p = partner(k.partnerId);
  return `<div class="card"><div class="card__head"><h3>Commission</h3>${tchip(COMM[k.status])}</div><dl class="kv">
    <dt>Disbursed amount</dt><dd>${inr(k.base)}</dd><dt>Payout rate</dt><dd>${k.rate}%${k.override ? ` <span class="tag">changed: ${esc(k.override)}</span>` : ' <span class="tag">from bank product</span>'}</dd>
    <dt>Commission</dt><dd><b>${inr(k.amount)}</b> before GST</dd>
    ${inv ? `<dt>Invoice</dt><dd><a href="#" data-act="viewInvoice" data-id="${inv.id}">${esc(inv.no)}</a> · ${day(inv.date)}</dd>` : ''}
    ${k.received != null ? `<dt>Received</dt><dd>${inr(k.received)}${k.tds ? ` + TDS ${inr(k.tds)}` : ''}${k.shortBy ? ` <span style="color:var(--bad)">· short by ${inr(k.shortBy)}</span>` : ''}</dd>` : ''}
    ${p ? `<dt>Referral partner</dt><dd>${esc(p.name)} · ${k.partnerRate}% = ${inr(k.partnerAmount)} ${tchip(PAYOUT[k.partnerStatus])}</dd>` : ''}
    <dt>Net to Finsol</dt><dd><b>${inr(k.amount - (k.partnerAmount || 0))}</b></dd></dl>
    <div class="actions" style="margin-top:12px">${isRole('superadmin') && k.status === 'expected' ? `<button class="btn btn--ghost btn--sm" data-act="overridePayout" data-case="${c.id}">Change payout rate</button>` : ''}<a class="btn btn--ghost btn--sm" href="#commissions">Open commissions</a></div></div>`;
}

Object.assign(ACT, {
  overridePayout(ds) {
    const c = getCase(ds.case), k = c.commission;
    modal({ title: 'Change payout rate for this case', body: `<p class="muted small">Bank product rate is ${bankProductAny(c.bankId, c.product)?.payout ?? '—'}%. Use this for a special rate agreed with the bank on this file.</p><div class="form-grid"><label class="field">Payout rate (%)<input name="rate" type="number" step="any" value="${k.rate}"></label><label class="field">Reason<input name="reason" placeholder="For example: festive scheme"></label></div>`, submit: 'Update commission', onSubmit(f) {
      if (f.rate === '' || +f.rate < 0) return 'Enter a valid rate.'; if (!f.reason) return 'Give a reason.';
      const old = k.rate; k.rate = +f.rate; k.amount = Math.round((k.base * k.rate) / 100); k.override = f.reason;
      log(c, `Payout rate changed ${old}% → ${k.rate}% (${f.reason}); commission now ${inr(k.amount)}`);
    } });
  },
  raiseInvoice(ds) {
    const b = bank(ds.bank), list = commCases().filter((c) => c.bankId === b.id && c.commission.status === 'expected');
    const st = M().settings, gst = +st.gstRate || 0, no = `${st.invoicePrefix}/${fyOf(now())}/${String((S.invSeq || 0) + 1).padStart(3, '0')}`;
    modal({ title: `Raise invoice to ${b.name}`, wide: true, body: `<div class="form-grid"><label class="field">Invoice number<input name="no" value="${esc(no)}"></label><label class="field">Invoice date<input type="date" name="date" value="${dueIn(0)}"></label></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th></th><th>Case</th><th>Customer</th><th>Disbursed</th><th>Rate</th><th>Commission</th></tr></thead><tbody>${list.map((c) => `<tr><td><input type="checkbox" name="cases" value="${c.id}" checked aria-label="Include ${c.id}"></td><td>${c.id}</td><td>${esc(c.applicant.name)}</td><td class="num">${amt(c.commission.base)}</td><td class="num">${c.commission.rate}%</td><td class="num">${inr(c.commission.amount)}</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted">GST at ${gst}% is added to the invoice (rate from System settings). Bank's DSA code: <b>${esc(b.dsaCode || '—')}</b> · payout cycle: ${esc(b.payoutCycle || '—')}.</p>`, submit: 'Raise invoice', onSubmit(f) {
      const ids = f._all('cases'); if (!ids.length) return 'Tick at least one case.'; if (!f.no) return 'Invoice number is required.';
      if (S.invoices.some((x) => x.no === f.no.trim())) return 'This invoice number is already used.';
      const cs = ids.map(getCase), base = cs.reduce((s, c) => s + c.commission.amount, 0), gstAmt = Math.round((base * gst) / 100);
      const inv = { id: 'i' + Math.random().toString(36).slice(2, 8), no: f.no.trim(), bankId: b.id, date: Date.parse(f.date) || now(), caseIds: ids, base, gstRate: gst, gst: gstAmt, total: base + gstAmt, status: 'raised', by: S.me };
      S.invoices.unshift(inv); S.invSeq = (S.invSeq || 0) + 1;
      cs.forEach((c) => { c.commission.status = 'invoiced'; c.commission.invoiceId = inv.id; log(c, `Commission invoiced on ${inv.no}`); });
      log(null, `Invoice ${inv.no} raised to ${b.name}: ${ids.length} case(s), ${inr(inv.total)} including GST`);
      toast(`Invoice ${inv.no} raised`);
    } });
  },
  recordReceipt(ds) {
    const inv = invoice(ds.id), b = bank(inv.bankId);
    modal({ title: `Record payment for ${inv.no}`, body: `<div class="note small">Invoice total <b>${inr(inv.total)}</b> (commission ${inr(inv.base)} + GST ${inr(inv.gst)}) from ${esc(b.name)}.</div><div class="form-grid"><label class="field">Amount received in bank (₹)<input name="amount" type="number" step="any" value="${inv.total}"></label><label class="field">TDS deducted by the bank (₹)<input name="tds" type="number" step="any" value="0"></label><label class="field">Date received<input type="date" name="date" value="${dueIn(0)}"></label><label class="field">Payment reference (UTR)<input name="ref"></label></div><p class="small muted">Amount received plus TDS is compared with the invoice total. Anything less is marked short paid so it can be followed up with the bank.</p>`, submit: 'Save payment', onSubmit(f) {
      if (!(+f.amount > 0)) return 'Enter the amount received.'; if (!f.ref) return 'Enter the payment reference.';
      const settled = +f.amount + (+f.tds || 0), short = Math.max(0, Math.round(inv.total - settled));
      inv.receipt = { amount: +f.amount, tds: +f.tds || 0, date: Date.parse(f.date) || now(), ref: f.ref, by: S.me }; inv.status = short > 1 ? 'short' : 'paid'; inv.shortBy = short > 1 ? short : 0;
      const share = settled / inv.total;
      inv.caseIds.map(getCase).filter(Boolean).forEach((c) => {
        const k = c.commission, part = (k.amount * (1 + inv.gstRate / 100));
        k.received = Math.round(part * (+f.amount / inv.total)); k.tds = Math.round(part * ((+f.tds || 0) / inv.total)); k.shortBy = inv.shortBy ? Math.round(part * (1 - share)) : 0;
        k.status = inv.shortBy ? 'short' : 'received'; k.receivedAt = inv.receipt.date;
        if (k.partnerStatus === 'hold') k.partnerStatus = 'due';
        log(c, `Bank payment recorded on ${inv.no}${inv.shortBy ? ', short paid' : ''}`);
      });
      log(null, `Payment of ${inr(+f.amount)} (TDS ${inr(+f.tds || 0)}) recorded for ${inv.no}, ref ${f.ref}${inv.shortBy ? `; short by ${inr(inv.shortBy)}` : ''}`);
      notify(adminIds(), `${b.name} paid ${inr(+f.amount)} on ${inv.no}${inv.shortBy ? `; short by ${inr(inv.shortBy)}` : ''}`, null);
      toast(inv.shortBy ? `Marked short paid by ${inr(inv.shortBy)}` : 'Invoice marked paid');
    } });
  },
  payPartner(ds) {
    const c = getCase(ds.case), k = c.commission, p = partner(k.partnerId);
    modal({ title: `Pay ${esc(p.name)}`, body: `<div class="note small">${k.partnerRate}% of ${inr(k.base)} on ${c.id} (${esc(c.applicant.name)}) = <b>${inr(k.partnerAmount)}</b>. Account ${esc(p.account || '—')}.</div><div class="form-grid"><label class="field">Date paid<input type="date" name="date" value="${dueIn(0)}"></label><label class="field">Payment reference<input name="ref"></label></div>`, submit: 'Mark paid', onSubmit(f) {
      if (!f.ref) return 'Enter the payment reference.';
      k.partnerStatus = 'paid'; k.partnerPaidAt = Date.parse(f.date) || now(); k.partnerRef = f.ref;
      log(c, `Referral payout ${inr(k.partnerAmount)} paid to ${p.name}, ref ${f.ref}`);
    } });
  },
  viewInvoice(ds) {
    const inv = invoice(ds.id), b = bank(inv.bankId), r = inv.receipt;
    modal({ title: `Invoice ${esc(inv.no)}`, submit: '', wide: true, body: `<div class="meta-row"><span>To <b>${esc(b.name)}</b></span><span>DSA code <b>${esc(b.dsaCode || '—')}</b></span><span>Date <b>${day(inv.date)}</b></span>${tchip(INV[inv.status])}</div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Case</th><th>Customer</th><th>Loan account</th><th>Disbursed</th><th>Rate</th><th>Commission</th></tr></thead><tbody>${inv.caseIds.map(getCase).filter(Boolean).map((c) => `<tr><td><a href="#case/${c.id}">${c.id}</a></td><td>${esc(c.applicant.name)}</td><td class="num">${esc(c.disbursal?.lan || '')}</td><td class="num">${amt(c.commission.base)}</td><td class="num">${c.commission.rate}%</td><td class="num">${inr(c.commission.amount)}</td></tr>`).join('')}</tbody></table></div>
      <dl class="kv"><dt>Commission</dt><dd>${inr(inv.base)}</dd><dt>GST ${inv.gstRate}%</dt><dd>${inr(inv.gst)}</dd><dt>Invoice total</dt><dd><b>${inr(inv.total)}</b></dd>${r ? `<dt>Received</dt><dd>${inr(r.amount)} on ${day(r.date)}, ref ${esc(r.ref)}</dd><dt>TDS deducted</dt><dd>${inr(r.tds)}</dd>${inv.shortBy ? `<dt>Short by</dt><dd style="color:var(--bad)">${inr(inv.shortBy)}</dd>` : ''}` : ''}</dl>` });
  },
});

let cfilter = { status: '', bank: '' };
function viewCommissions() {
  if (!canSeeMoney()) return '<div class="card"><p class="empty">Only Admins and the Super Admin can see commissions.</p></div>';
  const all = commCases(), sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);
  const expected = all.filter((c) => c.commission.status === 'expected');
  const openInv = S.invoices.filter((i) => i.status === 'raised');
  const recent = S.invoices.filter((i) => i.receipt && now() - i.receipt.date <= 30 * D);
  const shortInv = S.invoices.filter((i) => i.status === 'short');
  const due = all.filter((c) => c.commission.partnerStatus === 'due');
  const fyCases = all.filter((c) => c.disbursal.date >= fyStart());
  const byBank = M().banks.map((b) => { const bc = fyCases.filter((c) => c.bankId === b.id); return { b, n: bc.length, disb: sum(bc, (c) => c.commission.base), comm: sum(bc, (c) => c.commission.amount), rec: sum(bc, (c) => c.commission.received), part: sum(bc, (c) => c.commission.partnerAmount) }; }).filter((x) => x.n);
  const ready = M().banks.map((b) => ({ b, list: expected.filter((c) => c.bankId === b.id) })).filter((x) => x.list.length);
  let rows = all.sort((a, b) => b.disbursal.date - a.disbursal.date);
  if (cfilter.status) rows = rows.filter((c) => c.commission.status === cfilter.status);
  if (cfilter.bank) rows = rows.filter((c) => c.bankId === cfilter.bank);
  return `<div class="page-head"><div><h1>Commissions</h1><p class="muted">Commission is worked out automatically when a disbursal is recorded: disbursed amount × the bank product's payout rate. Financial year ${fyOf(now())}.</p></div></div>
    <div class="kpis"><div class="kpi"><b>${inr(sum(expected, (c) => c.commission.amount))}</b><span>Earned, not yet invoiced (${expected.length})</span></div><div class="kpi ${openInv.length ? 'kpi--warn' : ''}"><b>${inr(sum(openInv, (i) => i.total))}</b><span>Invoiced, awaiting payment (${openInv.length})</span></div><div class="kpi"><b>${inr(sum(recent, (i) => i.receipt.amount))}</b><span>Received in the last 30 days</span></div><div class="kpi ${shortInv.length ? 'kpi--bad' : ''}"><b>${inr(sum(shortInv, (i) => i.shortBy))}</b><span>Short paid by banks</span></div><div class="kpi ${due.length ? 'kpi--warn' : ''}"><b>${inr(sum(due, (c) => c.commission.partnerAmount))}</b><span>Referral payouts due (${due.length})</span></div><div class="kpi"><b>${inr(sum(fyCases, (c) => c.commission.amount - (c.commission.partnerAmount || 0)))}</b><span>Net commission this year, after referral payouts</span></div></div>
    <div class="grid2"><div class="card card--flush"><div class="card__head" style="padding:16px 18px 0"><h2>Ready to invoice</h2></div>${ready.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Bank</th><th>Payout cycle</th><th>Cases</th><th>Commission</th><th></th></tr></thead><tbody>${ready.map(({ b, list }) => `<tr><td>${esc(b.name)}</td><td>${esc(b.payoutCycle || '—')}</td><td class="num">${list.length}</td><td class="num">${inr(sum(list, (c) => c.commission.amount))}</td><td><button class="btn btn--primary btn--sm" data-act="raiseInvoice" data-bank="${b.id}">Raise invoice</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Nothing waiting to be invoiced.</p>'}</div>
    <div class="card card--flush"><div class="card__head" style="padding:16px 18px 0"><h2>Referral payouts</h2></div>${all.filter((c) => c.commission.partnerId).length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Partner</th><th>Case</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${all.filter((c) => c.commission.partnerId).map((c) => `<tr><td>${esc(partner(c.commission.partnerId)?.name || '')}</td><td><a href="#case/${c.id}">${c.id}</a></td><td class="num">${inr(c.commission.partnerAmount)} <span class="tiny muted">(${c.commission.partnerRate}%)</span></td><td>${tchip(PAYOUT[c.commission.partnerStatus])}</td><td>${c.commission.partnerStatus === 'due' ? `<button class="btn btn--brand btn--sm" data-act="payPartner" data-case="${c.id}">Mark paid</button>` : c.commission.partnerRef ? `<span class="tiny muted">${esc(c.commission.partnerRef)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted" style="padding:0 18px 14px">A partner's payout becomes due once the bank has paid Finsol for that case.</p>` : '<p class="empty">No referral partners on disbursed cases.</p>'}</div></div>
    <div class="card card--flush"><div class="card__head" style="padding:16px 18px 0"><h2>Invoices to banks</h2></div>${S.invoices.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Invoice</th><th>Bank</th><th>Date</th><th>Cases</th><th>Commission</th><th>GST</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${S.invoices.map((i) => `<tr><td><a href="#" data-act="viewInvoice" data-id="${i.id}"><b>${esc(i.no)}</b></a></td><td>${esc(bank(i.bankId).name)}</td><td>${day(i.date)}</td><td class="num">${i.caseIds.length}</td><td class="num">${inr(i.base)}</td><td class="num">${inr(i.gst)}</td><td class="num"><b>${inr(i.total)}</b></td><td>${tchip(INV[i.status])}${i.shortBy ? ` <span class="tiny" style="color:var(--bad)">by ${inr(i.shortBy)}</span>` : ''}</td><td>${i.status === 'raised' ? `<button class="btn btn--brand btn--sm" data-act="recordReceipt" data-id="${i.id}">Record payment</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">No invoices yet.</p>'}</div>
    <div class="card card--flush"><div class="card__head" style="padding:16px 18px 0;align-items:end"><h2>Commission by case</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="cfs" aria-label="Status" style="padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)"><option value="">All statuses</option>${Object.entries(COMM).map(([k, [l]]) => `<option value="${k}" ${cfilter.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select><select id="cfb" aria-label="Bank" style="padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)"><option value="">All banks</option>${M().banks.map((b) => `<option value="${b.id}" ${cfilter.bank === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div></div>${rows.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Case</th><th>Customer</th><th>Bank</th><th>Product</th><th>Disbursed</th><th>Date</th><th>Rate</th><th>Commission</th><th>Referral</th><th>Net</th><th>Status</th></tr></thead><tbody>${rows.map((c) => { const k = c.commission; return `<tr class="link" data-href="#case/${c.id}"><td><b>${c.id}</b></td><td>${esc(c.applicant.name)}</td><td>${esc(bank(c.bankId).name)}</td><td>${c.product}</td><td class="num">${amt(k.base)}</td><td>${day(c.disbursal.date)}</td><td class="num">${k.rate}%${k.override ? '*' : ''}</td><td class="num">${inr(k.amount)}</td><td class="num">${k.partnerAmount ? inr(k.partnerAmount) : '—'}</td><td class="num"><b>${inr(k.amount - (k.partnerAmount || 0))}</b></td><td>${tchip(COMM[k.status])}</td></tr>`; }).join('')}</tbody></table></div><p class="tiny muted" style="padding:0 18px 14px">* payout rate changed on that case by the Super Admin.</p>` : '<p class="empty">No disbursed cases match.</p>'}</div>
    <div class="card card--flush"><div class="card__head" style="padding:16px 18px 0"><h2>By bank, this financial year</h2></div>${byBank.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Bank</th><th>Disbursals</th><th>Amount disbursed</th><th>Commission</th><th>Received incl. GST</th><th>Referral payouts</th></tr></thead><tbody>${byBank.map((x) => `<tr><td>${esc(x.b.name)}</td><td class="num">${x.n}</td><td class="num">${amt(x.disb)}</td><td class="num">${inr(x.comm)}</td><td class="num">${inr(x.rec)}</td><td class="num">${inr(x.part)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">No disbursals this year.</p>'}</div>`;
}

/* =================== NOTIFICATIONS DRAWER =================== */
function openDrawer() {
  const list = S.notifications.filter((n) => n.userId === S.me);
  $('#overlayRoot').innerHTML = `<div class="drawer" role="dialog" aria-label="Notifications"><div class="drawer__head"><h2>Notifications</h2><div class="actions"><button class="btn btn--ghost btn--sm" data-act="readAll">Mark all read</button><button class="icon-btn" id="dclose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div><div class="drawer__list">${list.length ? list.map((n) => `<a href="#" class="notif ${n.read ? '' : 'unread'}" data-act="openNotif" data-id="${n.id}"><span>${esc(n.text)}</span><span class="tiny muted">${ago(n.at)}${n.caseId ? ' · ' + n.caseId : ''}</span></a>`).join('') : '<p class="empty">No notifications for ' + esc(me().name) + '.</p>'}</div></div>`;
  $('#dclose').addEventListener('click', closeDrawer);
}
function closeDrawer() { if ($('.drawer')) $('#overlayRoot').innerHTML = ''; }

/* =================== RENDER =================== */
function render() {
  const [route, arg] = (location.hash.slice(1) || 'dashboard').split('/');
  const allowed = NAV.find((n) => n[0] === route)?.[2];
  let html;
  if (route === 'case') html = viewCase(arg);
  else if (route === 'master') html = viewMaster(arg);
  else if (allowed && !allowed.includes(me().role)) html = `<div class="card"><p class="empty">${ROLES[me().role]} cannot open this page.</p></div>`;
  else html = ({ dashboard: viewDashboard, cases: viewCases, queue: viewQueue, tasks: viewTasks, allocation: viewAllocation, team: viewTeam, masters: viewMasters, access: viewAccess, commissions: viewCommissions, emails: viewEmails, audit: viewAudit }[route] || viewDashboard)();
  $('#view').innerHTML = html;
  renderSide();
  $('#viewAs').innerHTML = S.users.filter((u) => u.active !== false || u.id === S.me).map((u) => `<option value="${u.id}" ${u.id === S.me ? 'selected' : ''}>${u.name} · ${ROLES[u.role]}${u.label ? ' (' + u.label + ')' : ''}</option>`).join('');
  const unread = S.notifications.filter((n) => n.userId === S.me && !n.read).length;
  $('#bellDot').hidden = !unread; $('#bellDot').textContent = unread;
  const fq = $('#fq'); if (fq) { fq.addEventListener('input', () => { filter.q = fq.value; const pos = fq.selectionStart; render(); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); }); }
  const mq = $('#mq'); if (mq) { mq.addEventListener('input', () => { mfilter = mq.value; const pos = mq.selectionStart; render(); const n = $('#mq'); n.focus(); n.setSelectionRange(pos, pos); }); }
  $('#cfs')?.addEventListener('change', (e) => { cfilter.status = e.target.value; render(); });
  $('#cfb')?.addEventListener('change', (e) => { cfilter.bank = e.target.value; render(); });
  $('#fs')?.addEventListener('change', (e) => { filter.status = e.target.value; render(); });
  $('#fb')?.addEventListener('change', (e) => { filter.bank = e.target.value; render(); });
}

/* =================== EVENTS =================== */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); ACT[a.dataset.act]?.(a.dataset); return; }
  const pv = e.target.closest('[data-pickval]');
  if (pv) { const c = getCase(pv.dataset.case); c.applicant[pv.dataset.field] = pv.dataset.pickval; c.ocr[pv.dataset.field].source = 'manual'; log(c, `Chose "${pv.dataset.pickval}" for ${OCR_FIELDS.find((f) => f[0] === pv.dataset.field)[1]}`); save(); render(); return; }
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('a,button')) location.hash = row.dataset.href;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'viewAs') { S.me = t.value; caseTab = 'overview'; save(); render(); toast(`Now viewing as ${me().name}, ${ROLES[me().role]}`); return; }
  if (t.dataset.field && t.dataset.case) { const c = getCase(t.dataset.case), k = t.dataset.field; const v = t.value.trim(); if (k === 'pan' && v && !/^[A-Za-z]{5}\d{4}[A-Za-z]$/.test(v)) toast('PAN should look like ABCDE1234F'); c.applicant[k] = k === 'pan' ? v.toUpperCase() : v; c.ocr[k] = { ...(c.ocr[k] || { values: [] }), source: 'manual' }; log(c, `Corrected ${OCR_FIELDS.find((f) => f[0] === k)[1]}`); save(); render(); return; }
  if (t.dataset.loan && t.dataset.case) { const c = getCase(t.dataset.case), k = t.dataset.loan; c[k] = ['amount', 'tenure'].includes(k) ? +t.value.replace(/[^\d.]/g, '') || '' : t.value; if (k === 'product' && c.bankId && !bankProduct(c.bankId, c.product)) { c.bankId = ''; toast('That bank does not offer this product. Choose a bank again.'); } save(); render(); return; }
  if (t.dataset.access) { const [key, role] = t.dataset.access.split('|'); S.masterAccess[key][role] = t.value; log(null, `Master access: ${ROLES[role]} set to ${t.value} for ${MASTER[key].label}`); save(); render(); toast('Access updated'); return; }
  if (t.dataset.alloc) { if (!canEditMaster('allocation')) return; const [uid, bid] = t.dataset.alloc.split('|'); S.allocation[uid] = S.allocation[uid] || {}; if (t.value) S.allocation[uid][bid] = t.value; else delete S.allocation[uid][bid]; log(null, `${user(uid).name} set to ${t.value || 'none'} for ${bank(bid).name}`); save(); render(); toast('Allocation saved; applies to new cases'); return; }
  if (t.dataset.leave) { const u = user(t.dataset.leave); u.leave = t.checked; log(null, `${u.name} marked ${u.leave ? 'on leave' : 'back from leave'}`); save(); render(); return; }
  if (t.dataset.followup) { const u = user(t.dataset.followup); u.followUp = t.value; log(null, `${u.name}'s follow-up arrangement: ${t.value === 'sales' ? 'Sales Executive follows up' : 'Backend Executive follows up'}`); save(); render(); toast('Follow-up arrangement saved'); }
});
$('#bell').addEventListener('click', () => ($('.drawer') ? closeDrawer() : openDrawer()));
addEventListener('hashchange', () => { mfilter = ''; if (!location.hash.startsWith('#case/')) caseTab = 'overview'; closeDrawer(); render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
