<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sidebar navigation by role, top bar with "viewing as" switcher and notifications, main work area */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eef1f8; --ink: #0e1530; --muted: #5b6480; --line: #dde2ee;
  --brand: #1b2d6b; --brand-soft: #e7ecfa; --on-brand: #ffffff; --accent: #ff9f1c; --accent-strong: #d97800; --on-accent: #231300;
  --side: #0f1b47; --on-side: #dfe5ff; --on-side-muted: #9aa6d6;
  --good: #15803d; --good-soft: #e3f5e9; --warn: #b45309; --warn-soft: #fdf1dc; --bad: #b91c1c; --bad-soft: #fde6e6; --info: #1d4ed8; --info-soft: #e5edff;
  --shadow: 0 16px 40px -24px rgba(15,27,71,.45);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #080d1f; --surface: #10182f; --surface-2: #17213f; --ink: #e8ecf8; --muted: #a1abc8; --line: #26325a;
  --brand: #93a9ff; --brand-soft: #1b2750; --on-brand: #0a1230; --accent: #ffad3b; --accent-strong: #ffc06a; --on-accent: #231300;
  --side: #0a1230; --on-side: #dfe5ff; --on-side-muted: #8d99c9;
  --good: #4ade80; --good-soft: #10301f; --warn: #fbbf24; --warn-soft: #33260b; --bad: #f87171; --bad-soft: #3a1616; --info: #93b4ff; --info-soft: #16244a;
  --shadow: 0 16px 40px -24px rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #080d1f; --surface: #10182f; --surface-2: #17213f; --ink: #e8ecf8; --muted: #a1abc8; --line: #26325a;
  --brand: #93a9ff; --brand-soft: #1b2750; --on-brand: #0a1230; --accent: #ffad3b; --accent-strong: #ffc06a; --on-accent: #231300;
  --side: #0a1230; --on-side: #dfe5ff; --on-side-muted: #8d99c9;
  --good: #4ade80; --good-soft: #10301f; --warn: #fbbf24; --warn-soft: #33260b; --bad: #f87171; --bad-soft: #3a1616; --info: #93b4ff; --info-soft: #16244a;
  --shadow: 0 16px 40px -24px rgba(0,0,0,.8); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.015em; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }
p { margin: 0; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tiny { font-size: .76rem; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes scan { 0% { top: 0; } 100% { top: calc(100% - 3px); } }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--on-side); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; padding: 4px 10px 18px; color: #fff; }
.brand__mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #22398f, #0f1b47); border: 1px solid #2c3f86; display: grid; place-items: center; color: #ff9f1c; }
.brand small { display: block; font: 600 .7rem var(--font-body); color: var(--on-side-muted); letter-spacing: .08em; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--on-side); text-decoration: none; font-weight: 600; font-size: .94rem; }
.nav-item:hover { background: rgba(255,255,255,.07); }
.nav-item.active { background: rgba(255,159,28,.16); color: #ffcf8a; }
.nav-item .count { margin-left: auto; background: #ff9f1c; color: #231300; border-radius: 99px; font-size: .72rem; padding: 1px 7px; font-weight: 700; }
.nav-sep { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--on-side-muted); padding: 14px 12px 4px; }
.side__foot { margin-top: auto; font-size: .76rem; color: var(--on-side-muted); padding: 12px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.viewas { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 12px; }
.viewas label { font-size: .78rem; color: var(--muted); font-weight: 600; }
.viewas select { border: 0; background: transparent; font-weight: 700; padding: 6px 4px; max-width: 280px; }
.topbar__right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn .dot { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: .7rem; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
.content { padding: 24px; display: grid; gap: 20px; align-content: start; max-width: 1280px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { margin-top: 4px; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 10px; gap: 4px; }
  .brand { padding: 4px 8px; font-size: 1.05rem; }
  .brand small, .nav-sep, .side__foot { display: none; }
  .nav-item { white-space: nowrap; }
  .content { padding: 16px; }
  .topbar { padding: 10px 16px; }
}

/* basics */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid transparent; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .9rem; cursor: pointer; transition: transform .15s, background .15s, border-color .15s; white-space: nowrap; background: none; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--brand { background: var(--brand); color: var(--on-brand); }
.btn--ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn--ghost:hover { border-color: var(--brand); }
.btn--danger { background: var(--surface); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: var(--bad); }
.btn--sm { padding: 5px 10px; font-size: .82rem; border-radius: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.card--flush { padding: 0; overflow: hidden; }
.card__head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 1000px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; text-decoration: none; color: inherit; transition: transform .15s, box-shadow .15s; }
a.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kpi b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; }
.kpi span { color: var(--muted); font-size: .84rem; }
.kpi--warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.kpi--warn b { color: var(--warn); }
.kpi--bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.kpi--bad b { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip--info { background: var(--info-soft); color: var(--info); }
.chip--warn { background: var(--warn-soft); color: var(--warn); }
.chip--good { background: var(--good-soft); color: var(--good); }
.chip--bad { background: var(--bad-soft); color: var(--bad); }
.chip--plain::before { display: none; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: .72rem; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr { transition: background .15s; }
.tbl tbody tr.link { cursor: pointer; }
.tbl tbody tr.link:hover { background: var(--surface-2); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.field { display: grid; gap: 5px; font-size: .84rem; font-weight: 600; min-width: 0; }
.field input, .field select, .field textarea { font-weight: 500; font-size: .94rem; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.field textarea { resize: vertical; min-height: 70px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
.err { color: var(--bad); font-size: .84rem; font-weight: 600; }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: .88rem; }
.note--warn { background: var(--warn-soft); }
.note--info { background: var(--info-soft); }
.bar-list { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 170px minmax(0,1fr) 34px; gap: 10px; align-items: center; font-size: .88rem; text-decoration: none; color: inherit; }
.bar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 6px; transition: width .5s; }

/* case page */
.case-head { display: grid; gap: 14px; }
.case-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.meta-row { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.meta-row b { color: var(--ink); font-weight: 600; }
.stepper { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.stepper div { display: grid; gap: 6px; font-size: .74rem; color: var(--muted); font-weight: 600; text-align: center; }
.stepper i { height: 6px; border-radius: 6px; background: var(--surface-2); }
.stepper .done i { background: var(--brand); }
.stepper .now i { background: var(--accent); animation: pulse 1.6s infinite; }
.stepper .now { color: var(--ink); }
@media (max-width: 700px) { .stepper div span { display: none; } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.case-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .case-body { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 11px 14px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpanel { padding-top: 18px; display: grid; gap: 16px; animation: pop .3s ease; }
.next { border: 1.5px solid color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.people { display: grid; gap: 10px; }
.person { display: flex; gap: 10px; align-items: center; font-size: .88rem; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .74rem; color: #fff; flex-shrink: 0; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 12px; padding-bottom: 14px; position: relative; font-size: .88rem; }
.timeline li::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); margin-top: 6px; }
.timeline li::after { content: ''; position: absolute; left: 4px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }

/* documents + OCR */
.doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.doc { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: var(--surface); position: relative; overflow: hidden; align-content: start; }
.doc--missing { border-style: dashed; background: var(--surface-2); }
.doc__thumb { height: 92px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; position: relative; }
.doc__thumb img, .doc__thumb svg { width: 100%; height: 100%; object-fit: cover; }
.doc__thumb.scanning::after { content: ''; position: absolute; left: 0; right: 0; height: 3px; background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: scan .9s ease-in-out infinite alternate; }
.doc__name { font-weight: 700; font-size: .9rem; }
.doc__actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ocr-field { display: grid; gap: 4px; }
.ocr-field .src { font-size: .72rem; font-weight: 700; }
.src--high { color: var(--good); }
.src--check { color: var(--warn); }
.src--manual { color: var(--muted); }
.ocr-field input.check { border-color: color-mix(in srgb, var(--warn) 60%, var(--line)); background: var(--warn-soft); }
.pick { display: flex; gap: 6px; flex-wrap: wrap; }
.pick button { border: 1.5px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 8px; font-size: .82rem; cursor: pointer; }
.pick button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); font-weight: 700; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .88rem; }
.checklist li { display: flex; gap: 8px; align-items: center; }
.tick { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; font-weight: 800; flex-shrink: 0; }
.tick--yes { background: var(--good); color: #fff; }
.tick--no { border: 2px solid var(--line); }
.req { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.req--open { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.email { border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: .88rem; display: grid; gap: 6px; background: var(--surface-2); }
.email pre { margin: 0; white-space: pre-wrap; font: inherit; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(5,10,30,.55); display: grid; place-items: center; padding: 16px; animation: pop .2s ease; }
.modal { width: min(620px, 100%); max-height: calc(100% - 24px); overflow: auto; background: var(--surface); border-radius: 18px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); display: grid; animation: pop .3s ease; }
.modal__head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 6px; gap: 10px; }
.modal__body { padding: 10px 20px; display: grid; gap: 14px; }
.modal__foot { padding: 12px 20px 18px; display: flex; justify-content: flex-end; gap: 8px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 55; width: min(400px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; animation: pop .25s ease; }
.drawer__head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); gap: 8px; }
.drawer__list { overflow: auto; padding: 8px; display: grid; gap: 4px; align-content: start; }
.notif { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; font-size: .88rem; text-decoration: none; color: inherit; }
.notif:hover { background: var(--surface-2); }
.notif.unread { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); animation: pop .25s ease; }
.alloc td select { padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
.alloc td.on { background: var(--brand-soft); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .88rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--brand); }
</style>

</div>

function conflicts(c, k) { const vals = c.ocr[k]?.values || []; const uniq = [...new Map(vals.map((v) => [norm(v.value), v])).values()]; return uniq.length > 1 ? uniq : null; }

/* =================== MODAL =================== */
function modal({ title, body, submit = 'Save', danger = false, onSubmit, wide = false }) {
  const root = $('#overlayRoot');
  root.innerHTML = `<div class="overlay" id="ov"><form class="modal" id="mform" novalidate style="${wide ? 'width:min(760px,100%)' : ''}"><div class="modal__head"><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal__body">${body}<p class="err" id="merr" hidden></p></div><div class="modal__foot"><button type="button" class="btn btn--ghost" data-close>Cancel</button>${submit ? `<button type="submit" class="btn ${danger ? 'btn--danger' : 'btn--primary'}">${submit}</button>` : ''}</div></form></div>`;
  const close = () => { root.innerHTML = ''; };
  $$('[data-close]', root).forEach((b) => b.addEventListener('click', close));
  $('#ov').addEventListener('click', (e) => { if (e.target.id === 'ov') close(); });
  $('#mform').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    f._all = (name) => new FormData(e.target).getAll(name);
    const err = onSubmit(f);
    if (err) { $('#merr').textContent = err; $('#merr').hidden = false; return; }
    close(); save(); render();
  });
  $('input, select, textarea', root)?.focus();
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#overlayRoot').innerHTML = ''; closeDrawer(); } });
const dueIn = (days) => new Date(now() + days * D).toISOString().slice(0, 10);
const userOpts = (list, sel) => list.map((u) => `<option value="${u.id}" ${u.id === sel ? 'selected' : ''}>${esc(u.name)}${u.label ? ' (' + u.label + ')' : ''} · ${ROLES[u.role]}</option>`).join('');
const docChecks = (name, preselect = []) => `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px">${Object.entries(DOC_TYPES).map(([k, v]) => `<label class="switch"><input type="checkbox" name="${name}" value="${k}" ${preselect.includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</div>`;

/* =================== ACTION HANDLERS =================== */
const ACT = {
  reset() { modal({ title: 'Reset demo data?', body: '<p>All cases, notifications and settings go back to the sample data.</p>', submit: 'Reset', danger: true, onSubmit() { const keep = S.me; S = seed(); S.me = keep; toast('Demo data reset'); } }); },
  newCase() {
    modal({ title: 'New case', body: `<p class="muted small">Start with the customer's mobile number. We check for open cases with the same number first.</p><label class="field">Customer mobile number<input name="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile"></label><label class="field">Customer name (optional, OCR will fill it)<input name="name"></label>`, submit: 'Create draft', onSubmit(f) {
      if (!/^[6-9]\d{9}$/.test(f.mobile || '')) return 'Enter a valid 10-digit mobile number.';
      const dup = S.cases.find((c) => c.applicant.mobile === f.mobile && !['rejected', 'disbursed', 'withdrawn'].includes(c.status) && !(c.status === 'not-eligible' && c.eligibility?.confirmed));
      const id = `FS-2026-${String(++S.seq).padStart(5, '0')}`;
      const c = { id, status: 'draft', createdBy: S.me, createdAt: now(), product: 'Personal Loan', bankId: '', amount: '', tenure: 5, purpose: '', applicant: { name: f.name || '', mobile: f.mobile, fatherName: '', dob: '', gender: '', pan: '', aadhaar: '', email: '', address: '', employmentType: '', employer: '', netSalary: '', grossSalary: '', annualIncome: '', avgBalance: '' }, linked: [], docs: [], requests: [], ocr: {}, bank: {}, decision: null, disbursal: null, eligibility: null, finalSet: false, followUpOwner: null, override: '', unrouted: false };
      if (f.name) c.ocr.name = { values: [], source: 'manual' };
      S.cases.unshift(c); log(c, 'Case created');
      if (dup) toast(`Possible duplicate: ${dup.id} is open for this mobile number`);
      location.hash = '#case/' + id; return null;
    } });
  },
  sample(ds) { const c = getCase(ds.case); uploadDoc(c, ds.type, null, ds.req); },
  pickFile(ds) { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,application/pdf'; inp.onchange = () => { if (inp.files[0]) uploadDoc(getCase(ds.case), ds.type, inp.files[0], ds.req); }; inp.click(); },
  verifyDoc(ds) { const c = getCase(ds.case), d = c.docs.find((x) => x.id === ds.doc); d.status = 'verified'; d.comment = ''; log(c, `Verified ${docLabel(d.type)}`); save(); render(); },
  rejectDoc(ds) {
    const c = getCase(ds.case), d = c.docs.find((x) => x.id === ds.doc);
    modal({ title: `Needs replacement: ${docLabel(d.type)}`, body: '<label class="field">What is wrong?<textarea name="comment" placeholder="For example: blurred, older than 3 months, name mismatch"></textarea></label>', submit: 'Mark needs replacement', onSubmit(f) { if (!f.comment) return 'Add a short reason.'; d.status = 'replace'; d.comment = f.comment; log(c, `${docLabel(d.type)} needs replacement: ${f.comment}`); } });
  },
  download(ds) { const c = getCase(ds.case), d = c.docs.find((x) => x.id === ds.doc); log(c, `Downloaded ${docLabel(d.type)}`); save(); toast('Download logged in the audit trail (prototype: no real file)'); },
  deleteDoc(ds) { const c = getCase(ds.case), d = c.docs.find((x) => x.id === ds.doc); modal({ title: 'Delete document?', body: `<p>${docLabel(d.type)} will be removed. This is recorded in the audit log.</p>`, submit: 'Delete', danger: true, onSubmit() { c.docs = c.docs.filter((x) => x !== d); log(c, `Deleted ${docLabel(d.type)}`); } }); },
  submit(ds) {
    const c = getCase(ds.case), a = c.applicant;
    const req = [['name', 'Full name'], ['mobile', 'Mobile'], ['pan', 'PAN'], ['dob', 'Date of birth']].filter(([k]) => !a[k]).map(([, l]) => l);
    if (!c.bankId) req.push('Bank applied for'); if (!+c.amount) req.push('Loan amount');
    if (req.length) { toast('Fill in: ' + req.join(', ')); return; }
    if (a.pan && !/^[A-Z]{5}\d{4}[A-Z]$/.test(a.pan)) { toast('PAN should look like ABCDE1234F'); return; }
    const miss = missingDocs(c);
    modal({ title: 'Submit case for processing', body: `<div class="note"><b>${esc(a.name)}</b> · ${c.product} · ${amt(c.amount)} · ${bank(c.bankId).name}</div>${miss.length ? `<div class="note note--warn">Missing documents: <b>${miss.map(docLabel).join(', ')}</b>. You can still submit with a reason the Backend Executive will see.</div><label class="field">Reason for submitting without them<textarea name="override"></textarea></label>` : '<p class="muted small">All mandatory documents are uploaded. The case will be routed to the Backend Executives allocated to this bank, and everyone on the case is notified.</p>'}`, submit: 'Submit case', onSubmit(f) {
      if (miss.length && !f.override) return 'Give a reason or upload the missing documents first.';
      submitCase(c, f.override); toast('Submitted and routed to processing');
    } });
  },
  assignMe(ds) { const c = getCase(ds.case); assignTo(c, S.me, 'Picked up'); save(); toast('Case is now yours'); render(); },
  reassign(ds) {
    const c = getCase(ds.case);
    const list = S.users.filter((u) => u.role === 'backend');
    modal({ title: 'Assign Backend Executive', body: `<label class="field">Backend Executive<select name="uid">${userOpts(list, c.assignee)}</select></label><p class="muted small">Allocated to ${bank(c.bankId).name}: ${[...allocatedTo(c.bankId, 'primary'), ...allocatedTo(c.bankId, 'backup')].map((u) => u.name).join(', ') || 'nobody'}.</p>`, submit: 'Assign', onSubmit(f) { assignTo(c, f.uid, c.assignee ? 'Reassigned' : 'Assigned'); } });
  },
  requestDocs(ds) {
    const c = getCase(ds.case), owner = followUpOwner(c);
    const pre = [...missingDocs(c), ...c.docs.filter((d) => d.status === 'replace').map((d) => d.type)];
    modal({ title: 'Request documents', wide: true, body: `<div class="field">Documents needed${docChecks('items', pre)}</div><label class="field">Note for the follow-up owner<textarea name="note" placeholder="What is missing or wrong"></textarea></label><div class="form-grid"><label class="field">Follow-up owner<select name="owner">${userOpts([salesOf(c), user(c.assignee)].filter(Boolean), owner)}</select></label><label class="field">Due date<input type="date" name="due" value="${dueIn(2)}"></label></div><p class="muted small">Default owner comes from ${esc(salesOf(c).name)}'s arrangement: <b>${(c.followUpOwner || salesOf(c).followUp) === 'sales' ? 'Sales Executive follows up' : 'Backend Executive follows up'}</b>.</p>`, submit: 'Send request', onSubmit(f) {
      const items = f._all('items'); if (!items.length) return 'Pick at least one document.';
      requestItems(c, 'docs', items, f.note, f.owner, Date.parse(f.due)); toast('Request sent');
    } });
  },
  respond(ds) {
    const c = getCase(ds.case), r = c.requests.find((x) => x.id === ds.req);
    modal({ title: r.kind === 'docs' ? 'Upload requested documents' : 'Upload response to bank query', body: `<p class="small">${esc(r.note || '')}</p><div class="field">Documents uploaded now${docChecks('items', r.items)}</div><label class="field">Comment<textarea name="comment" placeholder="Optional"></textarea></label><p class="muted small">Prototype: ticked documents are added as sample files.</p>`, submit: 'Upload', onSubmit(f) {
      const items = f._all('items'); if (!items.length && r.kind === 'docs') return 'Tick the documents you are uploading.';
      items.forEach((t) => { c.docs.forEach((d) => { if (d.type === t && d.status === 'replace') d.status = 'superseded'; }); c.docs.push({ id: 'd' + Math.random().toString(36).slice(2, 8), type: t, name: `${t}_reupload.pdf`, by: S.me, at: now(), status: 'uploaded', comment: '' }); });
      if (r.kind === 'docs') {
        r.status = 'done'; r.doneAt = now(); r.comment = f.comment;
        log(c, `Uploaded requested documents: ${items.map(docLabel).join(', ')}`);

        notify([c.assignee, c.createdBy], `Documents uploaded on ${c.applicant.name}; ready to verify`, c);
      } else {
        r.status = 'responded'; r.respondedAt = now(); r.comment = f.comment;
        log(c, `Response to bank query uploaded${items.length ? ': ' + items.map(docLabel).join(', ') : ''}${f.comment ? ' (' + f.comment + ')' : ''}`);
        notify([c.assignee, c.createdBy], `Response ready for the bank on ${c.applicant.name}; submit it on the bank portal`, c);
      }
      toast('Uploaded');

  },
  resolveQuery(ds) {
    const c = getCase(ds.case), r = c.requests.find((x) => x.id === ds.req);
    r.status = 'done'; r.doneAt = now();
    log(c, 'Response submitted on bank portal; query resolved');

  },
  eligible(ds) {
    const c = getCase(ds.case);
    const notOk = c.docs.filter((d) => !['verified', 'superseded'].includes(d.status)).length, miss = missingDocs(c);
    if (notOk || miss.length) { toast(`Verify every document first (${notOk} not verified${miss.length ? ', ' + miss.length + ' missing' : ''})`); return; }
    modal({ title: 'Mark eligible', body: `<p>${esc(c.applicant.name)} is eligible for ${c.product} with ${bank(c.bankId).name}.</p><label class="field">Note (optional)<textarea name="reason"></textarea></label>`, submit: 'Mark eligible', onSubmit(f) { c.eligibility = { value: 'eligible', reason: f.reason, at: now() }; c.status = 'ready'; log(c, 'Marked eligible'); notify([c.createdBy, ...managerIds()], `${c.applicant.name} marked eligible for ${bank(c.bankId).name}`, c); } });
  },
  notEligible(ds) {
    const c = getCase(ds.case);
    modal({ title: 'Mark not eligible', body: `<label class="field">Reason<textarea name="reason" placeholder="For example: existing instalments too high for this bank"></textarea></label><p class="muted small">The Manager confirms before the case closes. The Sales Executive can copy it to another bank.</p>`, submit: 'Send for confirmation', danger: true, onSubmit(f) {
      if (!f.reason) return 'Give a reason.';

      log(c, `Marked not eligible: ${f.reason}`);

  },
  confirmNE(ds) { const c = getCase(ds.case); c.eligibility.confirmed = true; c.eligibility.confirmedBy = S.me; log(c, 'Not eligible confirmed; case closed'); notify([c.createdBy, c.assignee], `Not eligible confirmed for ${c.applicant.name}. You can copy the file to another bank.`, c, true); save(); render(); },
  sendBack(ds) { const c = getCase(ds.case); c.status = 'processing'; c.eligibility = null; log(c, 'Sent back to processing by Manager'); notify([c.assignee], `${c.applicant.name} sent back to you for another look`, c); save(); render(); },
  finalSet(ds) { const c = getCase(ds.case); modal({ title: 'Upload final document set', body: `<p>Upload the documents exactly as the ${esc(bank(c.bankId).name)} portal needs them (renamed or merged PDFs).</p><div class="note note--info">Prototype: confirm to record that the final set (${c.docs.filter((d) => d.status === 'verified').length} verified documents) is uploaded.</div>`, submit: 'Final set uploaded', onSubmit() { c.finalSet = true; log(c, 'Final document set uploaded for bank login'); } }); },
  reference(ds) {
    const c = getCase(ds.case), b = bank(c.bankId);
    modal({ title: `Bank login: ${b.name}`, body: `<div class="form-grid"><label class="field full">Bank reference number<input name="ref" placeholder="As shown on the bank portal"></label><label class="field">Login date<input type="date" name="date" value="${dueIn(0)}"></label><label class="field">Branch or scheme code (optional)<input name="branch"></label></div><div class="note">On save, the CRM emails ${spocsFor(b, c.product).map((s) => `<b>${esc(s.name)}</b> (${esc(s.product)})`).join(', ')} and notifies everyone on the case.</div>`, submit: 'Save and email SPOC', onSubmit(f) {

      log(c, `Logged in with bank, reference ${c.bank.ref}; SPOC emailed`);
      notify([c.createdBy, c.assignee, ...managerIds()], `Logged in with ${b.name}: ${c.applicant.name}, ref ${c.bank.ref}`, c, true);
      toast('Reference saved, bank SPOC emailed');
    } });
  },
  checked(ds) { const c = getCase(ds.case); c.portalCheckedAt = now(); log(c, 'Bank portal checked: no change'); save(); toast('Marked as checked today'); render(); },
  query(ds) {

  decision(ds) {
    const c = getCase(ds.case);

      if (f.type === 'rejected') { if (!f.reason) return 'Give the rejection reason from the bank.'; c.decision = { type: 'rejected', reason: f.reason, date: now() }; c.status = 'rejected'; }

  withdraw(ds) { const c = getCase(ds.case); modal({ title: 'Withdraw case', body: '<label class="field">Reason<textarea name="reason" placeholder="For example: customer took a loan elsewhere"></textarea></label>', submit: 'Withdraw', danger: true, onSubmit(f) { if (!f.reason) return 'Give a reason.'; c.status = 'withdrawn'; c.withdrawReason = f.reason; log(c, `Withdrawn: ${f.reason}`); notify([c.createdBy, c.assignee, ...managerIds()], `Withdrawn: ${c.applicant.name}`, c); } }); },
  reopen(ds) { const c = getCase(ds.case); c.status = c.assignee ? 'processing' : 'submitted'; if (c.eligibility?.value === 'not-eligible') c.eligibility = null; log(c, 'Case reopened'); notify([c.createdBy, c.assignee], `Reopened: ${c.applicant.name}`, c); save(); render(); },
  deleteCase(ds) { const c = getCase(ds.case); modal({ title: 'Delete case?', body: `<p>${c.id} and all its documents will be deleted. Only the Super Admin can do this. The deletion is kept in the audit log.</p>`, submit: 'Delete case', danger: true, onSubmit() { S.cases = S.cases.filter((x) => x !== c); log(null, `Deleted case ${c.id} (${c.applicant.name})`); location.hash = '#cases'; } }); },
  copyBank(ds) {

      c.linked.forEach((lid) => getCase(lid)?.linked.push(id)); c.linked.push(id);

};

function uploadDoc(c, type, file, reqId) {
  const d = { id: 'd' + Math.random().toString(36).slice(2, 8), type, name: file ? file.name : `${type}_sample.pdf`, by: S.me, at: now(), status: 'uploaded', comment: '', scanning: true };
  if (file && file.type.startsWith('image/')) { const fr = new FileReader(); fr.onload = () => { previews[d.id] = fr.result; render(); }; fr.readAsDataURL(file); }
  c.docs.push(d); render();
  setTimeout(() => {
    d.scanning = false;
    const n = c.status === 'draft' ? applyOcr(c, type) : 0;
    log(c, `Uploaded ${docLabel(type)}${n ? `; OCR read ${n} field${n > 1 ? 's' : ''}` : ''}`);
    save(); render();
    toast(n ? `OCR read ${n} field${n > 1 ? 's' : ''} from ${docLabel(type)}. Please check them.` : `${docLabel(type)} uploaded`);
  }, 1400);
}

function slaBreaches(list) {
  const out = [];
  list.forEach((c) => {
    if (c.status === 'submitted' && hoursSince(c.submittedAt) > SLA_H.pickup) out.push({ c, what: `Not picked up for ${Math.round(hoursSince(c.submittedAt))} h (target ${SLA_H.pickup} h)` });

    if (c.status === 'ready' && c.eligibility && hoursSince(c.eligibility.at) > SLA_H.login) out.push({ c, what: `Waiting for bank login ${Math.round(hoursSince(c.eligibility.at))} h` });

  return out;
}

/* ---------- case page ---------- */
function nextStep(c) {
  const be = user(c.assignee), owner = user(followUpOwner(c)), b = bank(c.bankId);
  switch (c.status) {
    case 'draft': return ['Sales Executive', 'Upload documents, check the details OCR read, add the bank and amount, then submit.'];
    case 'submitted': return c.unrouted ? ['Manager', `No Backend Executive is available for ${b.name}. Assign one.`] : ['Backend Executive', `Waiting for an executive allocated to ${b.name} to pick it up (target ${SLA_H.pickup} hours).`];
    case 'processing': return [be?.name || 'Backend Executive', 'Verify each document, then mark eligible or request documents.'];
    case 'docs-pending': return [user(openReqs(c, 'docs')[0]?.owner)?.name || owner.name, 'Collect the requested documents from the customer and upload them on the request.'];
    case 'not-eligible': return c.eligibility?.confirmed ? ['Sales Executive', 'Closed as not eligible. Copy the file to another bank if suitable.'] : ['Manager', 'Confirm not eligible, or send the case back to processing.'];
    case 'ready': return [be?.name || 'Backend Executive', c.finalSet ? `Log the file on the ${b.name} portal and enter the reference number.` : 'Upload the final document set for the bank.'];
    case 'review': return [be?.name || 'Backend Executive', 'Check the bank portal every working day. Log any query or record the decision.'];
    case 'query': { const r = openReqs(c, 'query')[0]; return r?.status === 'responded' ? [be?.name, 'Submit the response on the bank portal and mark it resolved.'] : [user(r?.owner)?.name || owner.name, "Get the answers or documents for the bank's query and upload them."]; }
    case 'sanctioned': return [be?.name || 'Backend Executive', 'Record the disbursal when the bank pays out.'];
    default: return ['', 'This case is closed.'];
  }
}

function caseActions(c) {
  const u = me(), b = [];
  const btn = (act, label, cls = 'btn--ghost', extra = '') => `<button class="btn ${cls}" data-act="${act}" data-case="${c.id}" ${extra}>${label}</button>`;
  const ownSales = u.role === 'sales' && c.createdBy === u.id;
  if (c.status === 'draft' && (ownSales || isMgr())) b.push(btn('submit', 'Submit case', 'btn--primary'));
  if (inMyQueue(c)) b.push(btn('assignMe', 'Assign to me', 'btn--primary'));
  if (c.status === 'processing' && canWork(c) && u.role !== 'sales') { b.push(btn('eligible', 'Mark eligible', 'btn--primary'), btn('requestDocs', 'Request documents'), btn('notEligible', 'Not eligible', 'btn--danger')); }
  if (c.status === 'docs-pending' && canWork(c) && u.role !== 'sales') b.push(btn('requestDocs', 'Request more documents'));
  if (c.status === 'not-eligible' && !c.eligibility?.confirmed && isMgr()) b.push(btn('confirmNE', 'Confirm not eligible', 'btn--danger'), btn('sendBack', 'Send back to processing'));
  if (c.status === 'ready' && canWork(c) && u.role !== 'sales') b.push(c.finalSet ? btn('reference', 'Enter bank reference number', 'btn--primary') : btn('finalSet', 'Upload final document set', 'btn--primary'));
  if (['review', 'query'].includes(c.status) && canWork(c) && u.role !== 'sales') b.push(btn('decision', 'Record bank decision', 'btn--primary'), btn('query', 'Log bank query'), btn('checked', 'Portal checked, no change'));
  if (c.status === 'sanctioned' && canWork(c) && u.role !== 'sales') b.push(btn('disburse', 'Record disbursal', 'btn--primary'));
  if (['submitted', 'processing', 'docs-pending', 'ready', 'review', 'query'].includes(c.status) && isMgr()) b.push(btn('reassign', c.assignee ? 'Reassign' : 'Assign'));
  if (c.status !== 'draft' && (ownSales || isMgr())) b.push(btn('copyBank', 'Copy to another bank'));
  if ([...OPEN, 'draft'].includes(c.status) && (isMgr() || isAssignee(c) || (c.status === 'draft' && ownSales))) b.push(btn('withdraw', 'Withdraw', 'btn--danger'));
  if ((['rejected', 'disbursed', 'withdrawn'].includes(c.status) || (c.status === 'not-eligible' && c.eligibility?.confirmed)) && isRole('admin', 'superadmin')) b.push(btn('reopen', 'Reopen'));
  if (isRole('superadmin')) b.push(btn('deleteCase', 'Delete case', 'btn--danger'));
  return b.join('');
}

function draftEditor(c) {
  const a = c.applicant, canEdit = c.createdBy === S.me || isMgr();
  const types = [...new Set([...(REQUIRED[c.product] || []), 'address', 'itr', 'photo'])];
  const docTile = (type) => {
    const ds = c.docs.filter((d) => d.type === type);
    const req = (REQUIRED[c.product] || []).includes(type);
    if (!ds.length) return `<div class="doc doc--missing"><div class="doc__thumb"><span class="muted small">Not uploaded</span></div><div class="doc__name">${docLabel(type)} ${req ? '<span class="tag">required</span>' : ''}</div>${canEdit ? `<div class="doc__actions"><button class="btn btn--ghost btn--sm" data-act="pickFile" data-case="${c.id}" data-type="${type}">Upload file</button><button class="btn btn--ghost btn--sm" data-act="sample" data-case="${c.id}" data-type="${type}">Use sample</button></div>` : ''}</div>`;
    return ds.map((d) => `<div class="doc"><div class="doc__thumb ${d.scanning ? 'scanning' : ''}">${previews[d.id] ? `<img src="${previews[d.id]}" alt="">` : docMock(type)}</div><div class="doc__name">${docLabel(type)}</div><span class="tiny muted">${esc(d.name)} · ${d.scanning ? 'reading with OCR…' : ago(d.at)}</span></div>`).join('');
  };
  const fieldHtml = ([k, label]) => {
    const meta = c.ocr[k], conf = conflicts(c, k);
    const src = meta?.source === 'manual' ? '<span class="src src--manual">typed or corrected</span>' : meta?.source ? `<span class="src src--${meta.conf}">${meta.conf === 'check' ? 'Check · ' : 'OCR · '}from ${docLabel(meta.source)}</span>` : '<span class="src src--manual">&nbsp;</span>';
    const val = k === 'aadhaar' && a[k] ? a[k] : a[k] ?? '';
    return `<div class="ocr-field ${k === 'address' ? 'full' : ''}"><label class="field">${label}${k === 'aadhaar' ? ' <span class="tiny muted">(full number never stored)</span>' : ''}<input data-field="${k}" data-case="${c.id}" value="${esc(val)}" ${k === 'dob' ? 'type="date"' : ''} class="${meta?.conf === 'check' && meta?.source !== 'manual' ? 'check' : ''}" ${canEdit ? '' : 'disabled'} ${k === 'aadhaar' ? 'maxlength="4" inputmode="numeric"' : ''}></label>${src}${conf ? `<div class="note note--warn small">Documents disagree. Pick the correct value:<div class="pick" style="margin-top:6px">${conf.map((v) => `<button type="button" data-pickval="${esc(v.value)}" data-field="${k}" data-case="${c.id}" aria-pressed="${norm(v.value) === norm(a[k])}">${esc(v.value)} <span class="tiny muted">(${docLabel(v.src)})</span></button>`).join('')}</div></div>` : ''}</div>`;
  };
  const miss = missingDocs(c);
  return `<div class="grid2" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)">
    <div class="card"><div class="card__head"><h2>1. Upload documents</h2><span class="small muted">OCR reads each one</span></div><div class="doc-grid">${types.map(docTile).join('')}</div></div>
    <div class="card"><div class="card__head"><h2>2. Check customer details</h2><span class="small muted">Amber = please check</span></div><div class="form-grid">${OCR_FIELDS.map(fieldHtml).join('')}</div></div>
  </div>
  <div class="card"><div class="card__head"><h2>3. Loan details</h2></div><div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <label class="field">Product<select data-loan="product" data-case="${c.id}" ${canEdit ? '' : 'disabled'}>${PRODUCTS.map((p) => `<option ${p === c.product ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
    <label class="field">Bank applied for<select data-loan="bankId" data-case="${c.id}" ${canEdit ? '' : 'disabled'}><option value="">Choose bank</option>${BANKS.map((b) => `<option value="${b.id}" ${b.id === c.bankId ? 'selected' : ''}>${b.name}</option>`).join('')}</select></label>
    <label class="field">Loan amount (₹)<input data-loan="amount" data-case="${c.id}" inputmode="numeric" value="${esc(c.amount)}" ${canEdit ? '' : 'disabled'}></label>
    <label class="field">Tenure (years)<input data-loan="tenure" data-case="${c.id}" inputmode="numeric" value="${esc(c.tenure)}" ${canEdit ? '' : 'disabled'}></label>
    <label class="field" style="grid-column:1/-1">Purpose<input data-loan="purpose" data-case="${c.id}" value="${esc(c.purpose)}" ${canEdit ? '' : 'disabled'}></label>
  </div>
  <div class="note" style="margin-top:14px"><b>Document checklist for ${c.product}:</b><ul class="checklist" style="margin-top:8px">${(REQUIRED[c.product] || []).map((t) => `<li><span class="tick ${c.docs.some((d) => d.type === t) ? 'tick--yes' : 'tick--no'}">${c.docs.some((d) => d.type === t) ? '✓' : ''}</span>${docLabel(t)}</li>`).join('')}</ul></div>
  <div class="actions" style="margin-top:14px;justify-content:space-between;align-items:center"><span class="small muted">${miss.length ? `${miss.length} required document${miss.length > 1 ? 's' : ''} missing` : 'All required documents uploaded'} · saved automatically</span>${canEdit ? `<button class="btn btn--primary" data-act="submit" data-case="${c.id}">Submit case</button>` : ''}</div></div>`;
}

function tabOverview(c) {
  const a = c.applicant;
  const row = (k, l) => `<dt>${l}</dt><dd>${esc(k === 'aadhaar' && a[k] ? 'XXXX XXXX ' + a[k] : ['netSalary', 'grossSalary', 'annualIncome', 'avgBalance'].includes(k) ? inr(a[k]) : k === 'dob' && a[k] ? day(Date.parse(a[k])) : a[k] || '—')}${c.ocr[k]?.source && c.ocr[k].source !== 'manual' ? ` <span class="tag">OCR</span>` : ''}</dd>`;
  return `<div class="grid2"><div class="card"><h3 style="margin-bottom:12px">Applicant</h3><dl class="kv">${OCR_FIELDS.map(([k, l]) => row(k, l)).join('')}</dl></div>
    <div style="display:grid;gap:20px;align-content:start"><div class="card"><h3 style="margin-bottom:12px">Loan request</h3><dl class="kv"><dt>Product</dt><dd>${c.product}</dd><dt>Bank</dt><dd>${bank(c.bankId)?.name || '—'}</dd><dt>Amount</dt><dd>${amt(c.amount)}</dd><dt>Tenure</dt><dd>${c.tenure || '—'} years</dd><dt>Purpose</dt><dd>${esc(c.purpose || '—')}</dd>${c.override ? `<dt>Submitted with</dt><dd>missing items: ${esc(c.override)}</dd>` : ''}</dl></div>
    <div class="card"><h3 style="margin-bottom:12px">Processing</h3><dl class="kv"><dt>Eligibility</dt><dd>${c.eligibility ? (c.eligibility.value === 'eligible' ? 'Eligible' : 'Not eligible' + (c.eligibility.confirmed ? ' (confirmed)' : ' (awaiting manager)')) + (c.eligibility.reason ? ': ' + esc(c.eligibility.reason) : '') : '—'}</dd><dt>Final set uploaded</dt><dd>${c.finalSet ? 'Yes' : 'No'}</dd><dt>Follow-up owner</dt><dd>${user(followUpOwner(c)).name}${c.followUpOwner ? ' (set on this case)' : ' (default)'} ${(isMgr() || isAssignee(c)) && c.status !== 'draft' ? `<button class="btn btn--ghost btn--sm" data-act="followUpCase" data-case="${c.id}">Change</button>` : ''}</dd>${c.withdrawReason ? `<dt>Withdrawn</dt><dd>${esc(c.withdrawReason)}</dd>` : ''}</dl></div></div></div>`;
}

function tabDocs(c) {
  const verifying = ['processing', 'docs-pending'].includes(c.status) && canWork(c) && me().role !== 'sales';
  const canDownload = me().role !== 'sales';
  const docs = c.docs.filter((d) => d.status !== 'superseded');
  const miss = missingDocs(c);
  const st = { uploaded: ['to verify', 'info'], verified: ['Verified', 'good'], replace: ['Needs replacement', 'bad'] };
  return `${c.override ? `<div class="note note--warn small">Submitted with missing items. Sales Executive's reason: ${esc(c.override)}</div>` : ''}
    <div class="doc-grid">${docs.map((d) => `<div class="doc"><div class="doc__thumb ${d.scanning ? 'scanning' : ''}">${previews[d.id] ? `<img src="${previews[d.id]}" alt="">` : docMock(d.type)}</div><div style="display:flex;justify-content:space-between;gap:6px;align-items:start"><span class="doc__name">${docLabel(d.type)}</span><span class="chip chip--${st[d.status]?.[1] || 'info'}">${st[d.status]?.[0] || d.status}</span></div><span class="tiny muted">${esc(d.name)} · ${user(d.by)?.name || ''} · ${ago(d.at)}</span>${d.comment ? `<span class="small" style="color:var(--bad)">${esc(d.comment)}</span>` : ''}<div class="doc__actions">${verifying && d.status !== 'verified' ? `<button class="btn btn--brand btn--sm" data-act="verifyDoc" data-case="${c.id}" data-doc="${d.id}">Verify</button>` : ''}${verifying && d.status !== 'replace' ? `<button class="btn btn--ghost btn--sm" data-act="rejectDoc" data-case="${c.id}" data-doc="${d.id}">Needs replacement</button>` : ''}${canDownload ? `<button class="btn btn--ghost btn--sm" data-act="download" data-case="${c.id}" data-doc="${d.id}">Download</button>` : '<span class="tiny muted">View only</span>'}${isRole('superadmin') ? `<button class="btn btn--danger btn--sm" data-act="deleteDoc" data-case="${c.id}" data-doc="${d.id}">Delete</button>` : ''}</div></div>`).join('')}
    ${miss.map((t) => `<div class="doc doc--missing"><div class="doc__thumb"><span class="muted small">Missing</span></div><div class="doc__name">${docLabel(t)} <span class="tag">required</span></div></div>`).join('')}</div>`;
}

function tabRequests(c) {
  if (!c.requests.length) return '<p class="empty">No document requests or bank queries on this case.</p>';
  return c.requests.map((r) => {
    const canResp = r.status === 'open' && (r.owner === S.me || isMgr());
    const canResolve = r.kind === 'query' && r.status === 'responded' && canWork(c) && me().role !== 'sales';
    return `<div class="req ${r.status !== 'done' ? 'req--open' : ''}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${r.kind === 'docs' ? 'Document request' : 'Bank query'}</b><span class="chip ${r.status === 'done' ? 'chip--good' : r.due < now() ? 'chip--bad' : 'chip--warn'}">${r.status === 'done' ? 'Closed ' + day(r.doneAt) : r.status === 'responded' ? 'Response uploaded' : 'Open · due ' + day(r.due)}</span></div>${r.note ? `<p class="small">${esc(r.note)}</p>` : ''}<p class="small"><b>Needed:</b> ${r.items.map(docLabel).join(', ') || 'clarification'}</p><p class="small muted">Raised by ${user(r.by)?.name} on ${dt(r.createdAt)} · follow-up owner <b>${user(r.owner)?.name}</b>${r.comment ? ' · reply: ' + esc(r.comment) : ''}</p>${canResp || canResolve ? `<div class="actions">${canResp ? `<button class="btn btn--primary btn--sm" data-act="respond" data-case="${c.id}" data-req="${r.id}">${r.kind === 'docs' ? 'Upload documents' : 'Upload response'}</button>` : ''}${canResolve ? `<button class="btn btn--brand btn--sm" data-act="resolveQuery" data-case="${c.id}" data-req="${r.id}">Submitted on bank portal</button>` : ''}</div>` : ''}</div>`;
  }).join('');
}

function tabBank(c) {
  const b = bank(c.bankId), emails = S.emails.map((e, i) => ({ e, i })).filter(({ e }) => e.spoc && e.caseId === c.id);
  const d = c.decision, x = c.disbursal;
  return `<div class="grid2"><div class="card"><h3 style="margin-bottom:12px">Bank login</h3>${c.bank.ref ? `<dl class="kv"><dt>Bank</dt><dd>${b.name}</dd><dt>Reference number</dt><dd class="num">${esc(c.bank.ref)}</dd><dt>Login date</dt><dd>${day(c.bank.loginDate)}</dd><dt>Branch / scheme</dt><dd>${esc(c.bank.branch || '—')}</dd><dt>SPOC emailed</dt><dd>${dt(c.bank.spocAt)}</dd><dt>Portal last checked</dt><dd>${c.portalCheckedAt ? ago(c.portalCheckedAt) : '—'}</dd></dl>` : `<p class="muted">Not logged with ${b?.name || 'a bank'} yet.</p>`}
      ${emails.length ? `<div style="margin-top:12px;display:grid;gap:8px">${emails.map(({ e, i }) => `<button class="email" style="text-align:left;cursor:pointer" data-act="email" data-i="${i}"><b>Email to ${esc(e.to)}</b><span class="small muted">${esc(e.subject)}</span></button>`).join('')}</div>` : ''}</div>
    <div class="card"><h3 style="margin-bottom:12px">Decision and disbursal</h3>${d ? (d.type === 'sanctioned' ? `<dl class="kv"><dt>Decision</dt><dd>${chip('sanctioned')}</dd><dt>Amount</dt><dd>${amt(d.amount)}</dd><dt>Interest rate</dt><dd>${d.rate}% a year</dd><dt>Tenure</dt><dd>${d.tenure || '—'} years</dd><dt>Processing fee</dt><dd>${esc(d.fee || '—')}</dd><dt>Conditions</dt><dd>${esc(d.conditions || '—')}</dd><dt>Date</dt><dd>${day(d.date)}</dd><dt>Letter</dt><dd>${esc(d.letter || 'sanction_letter.pdf')}</dd></dl>` : `<dl class="kv"><dt>Decision</dt><dd>${chip('rejected')}</dd><dt>Reason</dt><dd>${esc(d.reason)}</dd><dt>Date</dt><dd>${day(d.date)}</dd></dl>`) : '<p class="muted">No decision yet.</p>'}
      ${x ? `<dl class="kv" style="margin-top:14px"><dt>Disbursed</dt><dd>${amt(x.amount)} (${esc(x.mode)})</dd><dt>Date</dt><dd>${day(x.date)}</dd><dt>Loan account</dt><dd class="num">${esc(x.lan)}</dd></dl>` : ''}</div></div>
    <div class="card"><h3 style="margin-bottom:10px">Bank queries on this case</h3>${c.requests.filter((r) => r.kind === 'query').length ? c.requests.filter((r) => r.kind === 'query').map((r) => `<p class="small" style="padding:8px 0;border-top:1px solid var(--line)"><b>${day(r.createdAt)}</b> · ${esc(r.note)} <span class="chip ${r.status === 'done' ? 'chip--good' : 'chip--warn'}">${r.status === 'done' ? 'resolved' : r.status}</span></p>`).join('') : '<p class="muted small">None.</p>'}</div>`;
}

function tabTimeline(c) {
  const items = S.audit.filter((x) => x.caseId === c.id).sort((a, b) => b.at - a.at);
  return `<div class="card"><ul class="timeline">${items.map((x) => `<li><span></span><div><b>${esc(x.text)}</b><div class="tiny muted">${x.by === 'system' ? 'CRM' : user(x.by)?.name || ''} · ${dt(x.at)}</div></div></li>`).join('')}</ul></div>`;
}

function viewCase(id) {
  const c = getCase(id);
  if (!c) return '<div class="card"><p class="empty">Case not found.</p></div>';
  if (!canSee(c)) return `<div class="card"><p class="empty">${esc(me().name)} (${ROLES[me().role]}) cannot see this case. Switch user at the top to see it.</p></div>`;
  const b = bank(c.bankId), se = salesOf(c), be = user(c.assignee);
  const stage = STAGE_OF[c.status], closedBad = ['rejected', 'withdrawn'].includes(c.status) || (c.status === 'not-eligible' && c.eligibility?.confirmed);
  const [who, what] = nextStep(c);
  const head = `<div class="case-head"><a href="#cases" class="small">← All cases</a><div class="case-title"><h1>${esc(c.applicant.name || 'New customer')}</h1>${chip(c.status, c.status === 'not-eligible' && !c.eligibility?.confirmed ? ' · awaiting manager' : '')}${c.unrouted && c.status === 'submitted' ? '<span class="chip chip--bad">unrouted</span>' : ''}</div>
    <div class="meta-row"><span><b class="num">${c.id}</b></span><span>${c.product}</span><span>${b ? b.name : 'Bank not chosen'}</span><span><b>${amt(c.amount)}</b></span><span>Mobile <b class="num">${esc(c.applicant.mobile)}</b></span>${c.bank.ref ? `<span>Bank ref <b class="num">${esc(c.bank.ref)}</b></span>` : ''}</div>
    ${c.status !== 'draft' ? `<div class="stepper" aria-label="Progress">${STAGES.map(([k, l], i) => `<div class="${closedBad && i >= stage ? '' : i < stage || (i === stage && ['disbursed'].includes(c.status)) ? 'done' : i === stage ? 'now' : ''}"><i></i><span>${l}</span></div>`).join('')}</div>` : ''}
    <div class="actions">${caseActions(c)}</div></div>`;
  if (c.status === 'draft') return head + draftEditor(c);
  const reqCount = openReqs(c).length;
  const tabs = [['overview', 'Overview'], ['docs', `Documents (${c.docs.filter((d) => d.status !== 'superseded').length})`], ['requests', `Requests and queries${reqCount ? ` (${reqCount} open)` : ''}`], ['bank', 'Bank'], ['timeline', 'Timeline']];
  if (!tabs.some(([k]) => k === caseTab)) caseTab = 'overview';
  const panel = { overview: tabOverview, docs: tabDocs, requests: tabRequests, bank: tabBank, timeline: tabTimeline }[caseTab](c);
  const linked = c.linked.map(getCase).filter(Boolean);
  return `${head}<div class="case-body"><div style="min-width:0"><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === caseTab}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div><div class="tabpanel">${panel}</div></div>
    <aside style="display:grid;gap:16px"><div class="card next"><p class="tiny muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">Next step${who ? ' · ' + esc(who) : ''}</p><p style="margin-top:6px;font-weight:600">${esc(what)}</p></div>
    <div class="card"><h3 style="margin-bottom:12px">People</h3><div class="people"><div class="person">${avatar(se)}<div><b>${se.name}</b><div class="tiny muted">Sales Executive · follow-up: ${se.followUp === 'sales' ? 'self' : 'backend'}</div></div></div>${be ? `<div class="person">${avatar(be)}<div><b>${be.name}</b><div class="tiny muted">Backend Executive${be.label ? ' · ' + be.label : ''}</div></div></div>` : '<p class="small muted">No Backend Executive yet.</p>'}${b ? `<div class="person"><span class="avatar" style="background:var(--surface-2);color:var(--ink)">B${b.no}</span><div><b>${spocsFor(b, c.product).map((s) => s.name).join(', ')}</b><div class="tiny muted">Bank SPOC · ${b.name}</div></div></div>` : ''}</div></div>
    ${linked.length ? `<div class="card"><h3 style="margin-bottom:10px">Linked cases</h3>${linked.map((l) => `<p class="small" style="padding:6px 0"><a href="#case/${l.id}">${l.id}</a> · ${bank(l.bankId)?.name} ${canSee(l) ? chip(l.status) : ''}</p>`).join('')}</div>` : ''}</aside></div>`;
}

function viewAllocation() {
  const execs = S.users.filter((u) => u.role === 'backend');
  return `<div class="page-head"><div><h1>Bank allocation</h1><p class="muted">Each Backend Executive receives submitted cases only for their banks. One primary executive: auto-assigned. Several: shared queue. Backups see a case when no primary is available or it waits past ${SLA_H.pickup} hours. Changes apply to new cases.</p></div></div>
    <div class="card card--flush alloc"><div class="table-wrap"><table class="tbl"><thead><tr><th>Backend Executive</th>${BANKS.map((b) => `<th>Bank ${b.no}<br><span style="text-transform:none;letter-spacing:0;font-weight:600">${b.name}</span></th>`).join('')}<th>On leave</th></tr></thead><tbody>${execs.map((u) => `<tr><td><b>${u.name}</b><div class="tiny muted">${u.label || ''}</div></td>${BANKS.map((b) => { const v = S.allocation[u.id]?.[b.id] || ''; return `<td class="${v ? 'on' : ''}"><select data-alloc="${u.id}|${b.id}" aria-label="${u.name} for ${b.name}"><option value="">—</option><option value="primary" ${v === 'primary' ? 'selected' : ''}>Primary</option><option value="backup" ${v === 'backup' ? 'selected' : ''}>Backup</option></select></td>`; }).join('')}<td><label class="switch"><input type="checkbox" data-leave="${u.id}" ${u.leave ? 'checked' : ''}> Leave</label></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h3 style="margin-bottom:8px">Routing preview</h3><div class="table-wrap"><table class="tbl"><thead><tr><th>Bank</th><th>A new case goes to</th></tr></thead><tbody>${BANKS.map((b) => { const p = allocatedTo(b.id, 'primary').filter((u) => !u.leave), k = allocatedTo(b.id, 'backup').filter((u) => !u.leave); return `<tr><td>${b.name}</td><td>${p.length === 1 ? `Auto-assigned to <b>${p[0].name}</b>` : p.length > 1 ? `Shared queue: <b>${p.map((u) => u.name).join(', ')}</b>` : k.length ? `Backup queue: <b>${k.map((u) => u.name).join(', ')}</b>` : '<span class="chip chip--bad">Unrouted, Manager alerted</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}

function viewTeam() {
  const sales = S.users.filter((u) => u.role === 'sales'), be = S.users.filter((u) => u.role === 'backend');
  return `<div class="page-head"><div><h1>Team and follow-up</h1><p class="muted">Who chases the customer for missing documents and bank queries, per Sales Executive. Can be overridden on a single case or request.</p></div></div>
    <div class="card card--flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>Sales Executive</th><th>Follow-up arrangement</th><th>Open cases</th></tr></thead><tbody>${sales.map((u) => `<tr><td><div class="person">${avatar(u)}<b>${u.name}</b></div></td><td><select data-followup="${u.id}" style="padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)"><option value="sales" ${u.followUp === 'sales' ? 'selected' : ''}>Sales Executive follows up</option><option value="backend" ${u.followUp === 'backend' ? 'selected' : ''}>Backend Executive follows up</option></select></td><td class="num">${S.cases.filter((c) => c.createdBy === u.id && OPEN.includes(c.status)).length}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card card--flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>Team member</th><th>Role</th><th>Banks</th><th>Status</th></tr></thead><tbody>${S.users.map((u) => `<tr><td><div class="person">${avatar(u)}<b>${u.name}</b></div></td><td>${ROLES[u.role]}${u.label ? ' · ' + u.label : ''}${u.title ? ' · ' + u.title : ''}</td><td class="small">${u.role === 'backend' ? myBanks(u).map((b) => bank(b).name + (S.allocation[u.id][b] === 'backup' ? ' (backup)' : '')).join(', ') : '—'}</td><td>${u.leave ? '<span class="chip chip--warn">On leave</span>' : '<span class="chip chip--good">Active</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function viewBanks() {
  return `<div class="page-head"><div><h1>Banks and SPOCs</h1><p class="muted">The SPOCs listed here are emailed automatically when a file is logged with their bank.</p></div></div>
    <div class="grid2">${BANKS.map((b) => `<div class="card"><div class="card__head"><h2>Bank ${b.no} · ${b.name}</h2><button class="btn btn--ghost btn--sm" data-act="addSpoc" data-bank="${b.id}">+ Add SPOC</button></div>${b.spocs.map((s) => `<div class="person" style="padding:6px 0"><span class="avatar" style="background:var(--brand)">${s.name.split(' ').map((w) => w[0]).join('')}</span><div><b>${esc(s.name)}</b><div class="tiny muted" style="user-select:all">${esc(s.email)}</div><div class="tiny muted">${esc(s.product)}</div></div></div>`).join('')}<p class="small muted" style="margin-top:8px">Allocated: ${[...allocatedTo(b.id, 'primary').map((u) => u.name), ...allocatedTo(b.id, 'backup').map((u) => u.name + ' (backup)')].join(', ') || 'nobody'}</p></div>`).join('')}</div>`;
}

function viewEmails() {
  return `<div class="page-head"><div><h1>Emails sent</h1><p class="muted">Emails generated by the CRM, including bank SPOC emails. Prototype: nothing is actually sent.</p></div></div>
    <div class="card card--flush">${S.emails.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Sent</th><th>To</th><th>Subject</th></tr></thead><tbody>${S.emails.map((e, i) => `<tr class="link" data-act="email" data-i="${i}"><td class="small">${dt(e.at)}</td><td>${e.spoc ? '<span class="tag">Bank SPOC</span> ' : ''}${esc(e.to)}</td><td>${esc(e.subject)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">No emails yet. Submit a case or enter a bank reference number to generate some.</p>'}</div>`;
}

function viewAudit() {
  const rows = S.audit.filter((a) => !a.caseId || canSee(getCase(a.caseId) || { status: 'x' })).slice(0, 200);
  return `<div class="page-head"><div><h1>Audit log</h1><p class="muted">Every action, with who did it and when. Cannot be edited.</p></div></div>
    <div class="card card--flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Case</th><th>Action</th></tr></thead><tbody>${rows.map((a) => `<tr><td class="small">${dt(a.at)}</td><td>${a.by === 'system' ? 'CRM' : esc(user(a.by)?.name || '')}</td><td>${a.caseId ? `<a href="#case/${a.caseId}">${a.caseId}</a>` : '—'}</td><td>${esc(a.text)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* =================== NOTIFICATIONS DRAWER =================== */
function openDrawer() {
  const list = S.notifications.filter((n) => n.userId === S.me);
  $('#overlayRoot').innerHTML = `<div class="drawer" role="dialog" aria-label="Notifications"><div class="drawer__head"><h2>Notifications</h2><div class="actions"><button class="btn btn--ghost btn--sm" data-act="readAll">Mark all read</button><button class="icon-btn" id="dclose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div><div class="drawer__list">${list.length ? list.map((n) => `<a href="#" class="notif ${n.read ? '' : 'unread'}" data-act="openNotif" data-id="${n.id}"><span>${esc(n.text)}</span><span class="tiny muted">${ago(n.at)}${n.caseId ? ' · ' + n.caseId : ''}</span></a>`).join('') : '<p class="empty">No notifications for ' + esc(me().name) + '.</p>'}</div></div>`;
  $('#dclose').addEventListener('click', closeDrawer);
}
function closeDrawer() { if ($('.drawer')) $('#overlayRoot').innerHTML = ''; }

/* =================== RENDER =================== */
function render() {
  const [route, arg] = (location.hash.slice(1) || 'dashboard').split('/');
  const allowed = NAV.find((n) => n[0] === route)?.[2];
  let html;
  if (route === 'case') html = viewCase(arg);
  else if (allowed && !allowed.includes(me().role)) html = `<div class="card"><p class="empty">${ROLES[me().role]} cannot open this page.</p></div>`;
  else html = ({ dashboard: viewDashboard, cases: viewCases, queue: viewQueue, tasks: viewTasks, allocation: viewAllocation, team: viewTeam, banks: viewBanks, emails: viewEmails, audit: viewAudit }[route] || viewDashboard)();
  $('#view').innerHTML = html;
  renderSide();
  $('#viewAs').innerHTML = S.users.map((u) => `<option value="${u.id}" ${u.id === S.me ? 'selected' : ''}>${u.name} · ${ROLES[u.role]}${u.label ? ' (' + u.label + ')' : ''}</option>`).join('');
  const unread = S.notifications.filter((n) => n.userId === S.me && !n.read).length;
  $('#bellDot').hidden = !unread; $('#bellDot').textContent = unread;
  const fq = $('#fq'); if (fq) { fq.addEventListener('input', () => { filter.q = fq.value; const pos = fq.selectionStart; render(); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); }); }
  $('#fs')?.addEventListener('change', (e) => { filter.status = e.target.value; render(); });
  $('#fb')?.addEventListener('change', (e) => { filter.bank = e.target.value; render(); });
}

/* =================== EVENTS =================== */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); ACT[a.dataset.act]?.(a.dataset); return; }
  const pv = e.target.closest('[data-pickval]');
  if (pv) { const c = getCase(pv.dataset.case); c.applicant[pv.dataset.field] = pv.dataset.pickval; c.ocr[pv.dataset.field].source = 'manual'; log(c, `Chose "${pv.dataset.pickval}" for ${OCR_FIELDS.find((f) => f[0] === pv.dataset.field)[1]}`); save(); render(); return; }
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('a,button')) location.hash = row.dataset.href;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'viewAs') { S.me = t.value; caseTab = 'overview'; save(); render(); toast(`Now viewing as ${me().name}, ${ROLES[me().role]}`); return; }
  if (t.dataset.field && t.dataset.case) { const c = getCase(t.dataset.case), k = t.dataset.field; const v = t.value.trim(); if (k === 'pan' && v && !/^[A-Za-z]{5}\d{4}[A-Za-z]$/.test(v)) toast('PAN should look like ABCDE1234F'); c.applicant[k] = k === 'pan' ? v.toUpperCase() : v; c.ocr[k] = { ...(c.ocr[k] || { values: [] }), source: 'manual' }; log(c, `Corrected ${OCR_FIELDS.find((f) => f[0] === k)[1]}`); save(); render(); return; }
  if (t.dataset.loan && t.dataset.case) { const c = getCase(t.dataset.case), k = t.dataset.loan; c[k] = ['amount', 'tenure'].includes(k) ? +t.value.replace(/[^\d.]/g, '') || '' : t.value; save(); render(); return; }
  if (t.dataset.alloc) { const [uid, bid] = t.dataset.alloc.split('|'); S.allocation[uid] = S.allocation[uid] || {}; if (t.value) S.allocation[uid][bid] = t.value; else delete S.allocation[uid][bid]; log(null, `${user(uid).name} set to ${t.value || 'none'} for ${bank(bid).name}`); save(); render(); toast('Allocation saved; applies to new cases'); return; }
  if (t.dataset.leave) { const u = user(t.dataset.leave); u.leave = t.checked; log(null, `${u.name} marked ${u.leave ? 'on leave' : 'back from leave'}`); save(); render(); return; }
  if (t.dataset.followup) { const u = user(t.dataset.followup); u.followUp = t.value; log(null, `${u.name}'s follow-up arrangement: ${t.value === 'sales' ? 'Sales Executive follows up' : 'Backend Executive follows up'}`); save(); render(); toast('Follow-up arrangement saved'); }
});
$('#bell').addEventListener('click', () => ($('.drawer') ? closeDrawer() : openDrawer()));
addEventListener('hashchange', () => { if (!location.hash.startsWith('#case/')) caseTab = 'overview'; closeDrawer(); render(); window.scrollTo(0, 0); });
render();
</script>
